gend">Clique em um número para abrir o item e sua correção.</p></section></div><div class="grid two"><section class="card"><h2>Precisão ao longo das tentativas</h2>${batches.length?`<div class="trend">${batches.slice(-10).map(b=>`<div style="height:${b.h/b.n*100}%" title="Tentativas ${b.start} a ${b.end}: ${b.h}/${b.n} acertos"><span>${pct(b.h,b.n)}</span></div>`).join('')}</div><p class="legend">Blocos cronológicos de até 10 tentativas; últimos 10 blocos. Inclui repetições e consultas. Passe o cursor sobre a barra para ver o intervalo.</p>`:'<p class="muted">Responda aos primeiros itens para acompanhar a evolução.</p>'}<div class="notes"><b>${state.attempts.length}</b> tentativas registradas · <b>${recovered}</b> questões que começaram com erro e agora têm acerto · <b>${state.attempts.filter(a=>a.consulted).length}</b> respostas após consulta ao gabarito.</div></section><section class="card"><h2>Cobertura por tema</h2><div class="tablewrap"><table><thead><tr><th>Tema</th><th>Feitas</th><th>Acerto atual</th></tr></thead><tbody>${themeStats().map(t=>`<tr><td>${esc(t.theme)}</td><td>${t.done}/${t.total}</td><td>${pct(t.done-t.err,t.done)}</td></tr>`).join('')}</tbody></table></div></section></div><p class="foot">Taxa de erro = erros ÷ respondidas × 100. Cada questão conta uma vez nos indicadores atuais. A primeira resposta fica preservada; consultas sem resposta não entram nas taxas. Os indicadores incluem respostas dadas após consulta, identificadas no histórico.</p>`;}
function sources(){return `<div class="pagehead"><div><div class="eyebrow">Recorte, fontes e dados</div><h1>Seu caderno, com fundamento.</h1><p class="muted">Lei seca aplicada ao conteúdo das aulas. Conferência das fontes oficiais: 19/09/2026.</p></div></div><div class="grid two"><section class="card"><h2>Como usar</h2><ol><li>Leia a assertiva e escolha <b>Certo</b> ou <b>Errado</b>.</li><li>Clique em <b>Responder</b> para registrar a tentativa e abrir a correção.</li><li>Observe o artigo e o ponto de atenção. Marque o item ou anote o que confundiu você.</li><li>Use <b>Desempenho</b> para revisar erros e acompanhar a cobertura.</li></ol><p><b>Treino de 10:</b> sorteia até dez itens entre os resultados do filtro atual, com correção imediata. É uma sessão de prática C/E; não reproduz as alternativas da prova do professor.</p><p><b>Consultar gabarito:</b> revela a correção sem computar resposta. Se você responder depois da consulta, isso fica registrado. Repetir uma questão mantém o histórico.</p><p><b>Armazenamento:</b> os dados ficam somente neste navegador, sem conta ou envio a servidor. Mover o arquivo, trocar de navegador ou limpar os dados pode impedir recuperar o progresso; exporte um backup.</p><div class="toolrow"><button class="primary" data-action="export">Exportar progresso</button><button data-action="import">Importar backup</button><button class="danger" data-action="reset">Zerar progresso</button></div></section><section class="card"><h2>Recorte da preparação</h2><p>Base principal: os cinco arquivos de <b>Aulas/</b>. Os cinco <b>Cadernos de questões/</b>, o <b>Material de apoio.md</b> e a revisão existente orientaram a seleção de distinções e erros recorrentes.</p><p>As ${Q.length} questões deste banco são <b>autorais, no estilo de julgamento CESPE/Cebraspe</b>. Não são questões oficiais nem foram atribuídas à banca ou ao professor.</p><p>Os itens identificados como <b>Complemento legal</b> aprofundam dispositivos da leitura preparatória da aula de cheque; não se presume sua cobrança. O foco solicitado é a <b>lei seca</b>: história, formulações doutrinárias e julgados presentes nos materiais não foram convertidos em comandos legais. Os artigos do Código Civil são usados respeitando a primazia das leis especiais.</p><p>A LUG deve ser lida com as reservas brasileiras. Evitou-se cobrar isoladamente seu prazo de protesto como se fosse automaticamente aplicável no Brasil.</p><p>Precisão frente ao material: a aula de letra distribui os requisitos em nove elementos didáticos; o art. 1º da LUG os organiza em oito itens. Não há questão que confunda essa contagem.</p><a href="https://www.planalto.gov.br/ccivil_03/decreto/antigos/d57663.htm" target="_blank" rel="noopener noreferrer">Decreto de promulgação e reservas brasileiras ↗</a></section></div><section class="card"><h2>Legislação consultada</h2>${Object.entries(REF).map(([k,v])=>`<div class="sourceitem"><a href="${v[1]}" target="_blank" rel="noopener noreferrer">${esc(v[0])} ↗</a><p>${Q.filter(q=>q.ref===k).length} itens fundamentados neste diploma. O artigo específico aparece em cada correção.</p></div>`).join('')}<p class="legend">As questões e o painel funcionam sem internet. A consulta aos links oficiais exige conexão.</p></section>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));$('app').innerHTML=view==='questions'?renderQuestions():view==='dashboard'?dashboard():sources();if(view==='questions')list();}
function showQuestions(){view='questions';page=0;render();window.scrollTo({top:0});}
function resetFilters(){filter={...filter,theme:'',status:'all',search:''};session=null;page=0;}
function updateQuestion(id){const q=byId[id],el=$(id);if(el)el.outerHTML=questionHTML(q);if($('stats'))$('stats').innerHTML=statsHTML();}
function printBank(){const heading=`<h1>Direito Empresarial · Certo ou errado</h1><p>${Q.length} questões autorais · Lei seca · Base nas aulas · 19/09/2026</p><p>Julgue cada assertiva. Gabarito comentado ao final.</p>`;$('printout').innerHTML=heading+Q.map(q=>`<article><p><b>${q.id} · ${esc(q.theme)}${q.complement?' · Complemento legal':''}</b></p><p>${esc(q.statement)}</p><p>□ Certo &nbsp; □ Errado</p></article>`).join('')+'<h2>Gabarito comentado</h2>'+Q.map(q=>`<article><p><b>${q.id} · ${q.answer?'CERTO':'ERRADO'} — ${esc(REF[q.ref][0])}, art. ${esc(q.article)}</b></p><p>${esc(q.explanation)}</p><p class="meta">Ponto de atenção: ${esc(q.trap)} · Fonte: <a href="${REF[q.ref][1]}">${esc(REF[q.ref][0])}</a></p></article>`).join('');window.print();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,action=b.dataset.action;
 if(b.dataset.view){view=b.dataset.view;render();window.scrollTo({top:0});return;}
 if(b.dataset.topic){filter.theme=b.dataset.topic;filter.status='wrong';filter.search='';session=null;showQuestions();return;}
 if(b.dataset.jump){resetFilters();filter.search=b.dataset.jump;showQuestions();return;}
 if(action==='answer'){if(typeof selected[id]!=='boolean'){toast('Selecione Certo ou Errado antes de responder.');return;}state.attempts.push({id,answer:selected[id],time:new Date().toISOString(),consulted:revealed.has(id)});retrying.delete(id);revealed.delete(id);delete selected[id];save();updateQuestion(id);toast((correct(last(id))?'Você acertou. ':'Resposta registrada. ')+id+': gabarito '+(byId[id].answer?'Certo.':'Errado.'));}
 if(action==='reveal'){revealed.add(id);updateQuestion(id);toast('Gabarito consultado; nenhuma tentativa registrada.');}
 if(action==='retry'){retrying.add(id);revealed.delete(id);delete selected[id];updateQuestion(id);}
 if(action==='flag'){const i=state.flags.indexOf(id);if(i<0)state.flags.push(id);else state.flags.splice(i,1);save();updateQuestion(id);}
 if(action==='clear'){resetFilters();showQuestions();}
 if(action==='prev'||action==='next'){page+=action==='next'?1:-1;list();$('question-list').scrollIntoView({block:'start'});}
 if(action==='review-errors'){resetFilters();filter.status='wrong';showQuestions();}
 if(action==='ten'){const available=pool();if(!available.length){toast('Não há questões nesse filtro para sortear.');return;}session=available.map(q=>({id:q.id,r:Math.random()})).sort((a,b)=>a.r-b.r).slice(0,10).map(x=>x.id);filter.status='all';filter.search='';filter.size=10;for(const i of session){retrying.add(i);revealed.delete(i);delete selected[i];}showQuestions();toast('Treino iniciado com '+session.length+' itens.');}
 if(action==='end-session'){session=null;retrying.clear();showQuestions();}
 if(action==='font'){const current=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--text'));document.documentElement.style.setProperty('--text',current>=24?'18px':current+2+'px');}
 if(action==='print')printBank();
 if(action==='export'){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='progresso-empresarial-ce.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup de progresso preparado.');}
 if(action==='import')$('import-file').click();
 if(action==='reset'&&confirm('Apagar todas as tentativas, marcações e anotações deste caderno neste navegador? Exporte um backup antes se quiser preservá-las.')){state={version:1,attempts:[],flags:[],notes:{}};selected={};revealed.clear();retrying.clear();save();render();toast('Progresso zerado.');}
});
document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))selected[e.target.name]=e.target.value==='true';if(['theme','status','order','size'].includes(e.target.id)){filter[e.target.id]=e.target.id==='size'?Number(e.target.value):e.target.value;if(e.target.id==='order'&&filter.order==='random')shuffle();page=0;list();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter.search=e.target.value;page=0;list();}if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();}});
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20000000)throw Error('Arquivo muito grande');const imported=validate(JSON.parse(await file.text()));if(confirm('Substituir o progresso atual pelo backup selecionado?')){state=imported;selected={};revealed.clear();retrying.clear();save();render();toast('Backup importado.');}}catch(err){toast('Não foi possível importar: arquivo inválido ou incompatível.');}e.target.value='';});
shuffle();render();
</script></body></html>
