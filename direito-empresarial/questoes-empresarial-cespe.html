<style>
:root{--bg:#f4f7fa;--paper:#fff;--ink:#17334a;--muted:#5b6f80;--line:#dbe4eb;--blue:#007da5;--pale:#e7f5fb;--green:#146548;--greenbg:#e9f6ef;--red:#b33344;--redbg:#fff0f2;--gold:#826000;--radius:12px;--text:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--paper);color:var(--ink);font-weight:600}button:hover{border-color:var(--blue);background:var(--pale)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:var(--red)}a{color:var(--blue);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d09409;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font:700 clamp(28px,3vw,40px)/1.2 'Trebuchet MS','Segoe UI',sans-serif;letter-spacing:-1px;margin-bottom:12px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}small,.muted{color:var(--muted)}.skip{position:absolute;left:10px;top:-100px;background:white;padding:10px;z-index:99}.skip:focus{top:10px}.top{background:white;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center;padding:18px max(24px,calc((100vw - 1440px)/2));flex-wrap:wrap}.brand{font:700 21px 'Trebuchet MS',sans-serif;letter-spacing:-.5px;display:flex;gap:12px;align-items:center}.brand-icon{background:var(--ink);color:#fff;font:700 17px Consolas,monospace;padding:8px 9px;border-radius:6px}.brand span em{font-style:normal;color:var(--blue)}.nav{display:flex;gap:6px;margin-left:auto}.nav button{border:0;background:transparent;font-size:14px}.nav button[aria-current=page]{background:var(--pale);color:var(--blue)}.shell{max-width:1440px;margin:auto;padding:30px 28px 65px}.eyebrow{font:600 11px/1.5 Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.pagehead{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:24px}.pagehead p{margin-bottom:0;max-width:750px}.date{border:1px solid var(--line);border-radius:8px;padding:12px 18px;background:#fff;font-size:12px;white-space:nowrap}.date strong{display:block;font-size:19px}.grid{display:grid;gap:18px}.metrics{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.metric{background:white;border:1px solid var(--line);padding:19px 22px;border-radius:var(--radius);position:relative}.metric b{font:700 30px 'Trebuchet MS',sans-serif;display:block;margin:7px 0}.metric .kicker{font-size:12px;color:var(--muted)}.metric progress{width:100%;height:5px;accent-color:var(--blue)}.metric.err b{color:var(--red)}.metric.ok b{color:var(--green)}.metric span{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);background:white;border-radius:var(--radius);padding:24px}.filters{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px}.field{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}select,input[type=search],textarea{border:1px solid #bbcbd7;background:white;color:var(--ink);border-radius:7px;padding:10px 12px;width:100%;min-width:0}.toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.toolrow label{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.toolrow select{width:auto;font-size:13px;padding:7px}.toolrow button{font-size:12px;padding:8px 12px}.spacer{flex:1}.resultbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 14px;font-size:13px}.pill{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--muted);background:#f9fbfc}.pill.blue{color:var(--blue);border-color:#b7ddeb;background:var(--pale)}.question{padding:0;overflow:hidden;margin-bottom:20px}.qhead{padding:17px 24px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.qnum{font:700 13px Consolas,monospace;color:var(--ink);padding-right:7px}.qhead button{margin-left:auto;padding:5px 10px;font-size:12px;border:0}.qhead button[aria-pressed=true]{background:#fff5ce;color:#6d5100}.statement{padding:23px 24px 20px;font-size:var(--text);line-height:1.65;margin:0;max-width:1120px}.choices{border:0;padding:0 24px 20px;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.choices legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.choice{display:flex;align-items:center;gap:9px;border:1px solid #c7d4de;padding:10px 22px;border-radius:8px;cursor:pointer;min-width:145px}.choice:has(input:checked){border-color:var(--blue);background:var(--pale)}input[type=radio]{accent-color:var(--blue);width:17px;height:17px;margin:0}.choices .answerbtn{min-width:145px}.linkbtn{background:transparent;border:0;color:var(--blue);font-weight:500;font-size:13px;padding:8px}.answerline{margin:0 24px 18px;font-size:14px}.feedback{padding:21px 24px;background:#f3f8fb;border-top:1px solid var(--line)}.feedback.good{background:var(--greenbg);border-top:2px solid var(--green)}.feedback.bad{background:var(--redbg);border-top:2px solid var(--red)}.feedback h3{font-size:17px;margin-bottom:10px}.feedback.good h3{color:var(--green)}.feedback.bad h3{color:var(--red)}.feedback p{margin:8px 0;font-size:15px}.feedback .legal{font-weight:600}.feedback .trap{font-size:13px;color:var(--muted);border-left:3px solid #a6b9c8;padding-left:11px;margin-top:13px}.feedback .source{font-size:12px;margin-top:15px}.qfoot{border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:20px;align-items:start}.qfoot details{font-size:12px;flex:1}.qfoot summary{cursor:pointer;color:var(--muted);width:max-content}.qfoot textarea{margin-top:12px;resize:vertical;min-height:85px;font-size:14px;font-weight:400}.history{padding-left:18px}.pager{display:flex;justify-content:center;align-items:center;gap:18px;margin:25px 0}.empty{text-align:center;padding:55px 25px;border:1px dashed #b7c9d6;background:#fff;border-radius:12px}.empty h2{font-size:20px}.two{grid-template-columns:1.2fr 1fr;margin-bottom:20px}.rank{display:grid;grid-template-columns:minmax(140px,1fr) 2fr 72px;gap:12px;align-items:center;margin:18px 0;font-size:13px}.bar{height:10px;background:#e7edf2;border-radius:5px;overflow:hidden}.bar i{display:block;background:var(--red);height:100%;border-radius:5px}.rank strong{font-size:12px;text-align:right}.rank button{border:0;background:transparent;padding:0;text-align:left;font-size:13px;color:var(--blue)}.legend{font-size:12px;color:var(--muted);margin:15px 0 0}.map{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}.cell{height:28px;min-width:28px;border-radius:4px;padding:0;font:10px Consolas,monospace;background:#ecf1f5;color:#627586;border:1px solid #dbe4eb}.cell.good{background:#c7e8d7;color:#105037;border-color:#9bd0b5}.cell.bad{background:#f5cbd1;color:#8b2332;border-color:#e79da9}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{background:#f7fafc;font-size:12px}.notes{font-size:13px;background:var(--pale);padding:16px 20px;border-radius:8px;margin:20px 0}.sourceitem{padding:18px 0;border-bottom:1px solid var(--line)}.sourceitem p{font-size:13px;margin:7px 0 0}.foot{font-size:12px;color:var(--muted);margin-top:28px}.notice{padding:12px 18px;background:#fff5d4;border:1px solid #e2c365;border-radius:8px;font-size:13px;margin-bottom:20px}#toast{position:fixed;bottom:22px;right:22px;max-width:440px;background:var(--ink);color:white;padding:13px 18px;border-radius:8px;z-index:99;font-size:13px;box-shadow:0 4px 20px #0002}#toast:empty{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#printout{display:none}.trend{display:flex;height:120px;align-items:end;gap:8px;border-bottom:1px solid var(--line);margin-top:24px}.trend div{flex:1;background:var(--blue);min-height:2px;position:relative;border-radius:4px 4px 0 0}.trend span{position:absolute;top:-24px;font-size:11px;left:50%;transform:translateX(-50%);white-space:nowrap}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font-size:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.sectionhead h2{margin:0}
@media(max-width:900px){.top{padding:16px 20px}.shell{padding:23px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .field:last-child{grid-column:1/-1}.date{display:none}.rank{grid-template-columns:1fr 1fr 60px}.top .nav{margin-left:0}.pagehead{display:block}}
@media(max-width:520px){.shell{padding:20px 12px}.top{gap:12px}.brand{font-size:19px}.nav{width:100%;justify-content:space-between}.nav button{padding:9px 12px}.metrics{gap:10px}.metric{padding:14px}.metric b{font-size:27px}.card{padding:18px}.question{padding:0}.qhead{padding:15px 17px 0}.statement{padding:20px 17px;font-size:17px}.choices{padding:0 17px 18px;gap:8px}.choice{min-width:0;flex:1;padding:10px 15px}.choices .answerbtn{width:100%}.choices .linkbtn{width:100%}.qfoot{padding:12px 17px;gap:12px}.feedback{padding:18px 17px}.filters{grid-template-columns:1fr}.filters .field:last-child{grid-column:auto}.toolrow .spacer{display:none}.resultbar{align-items:start;flex-direction:column}h1{font-size:29px}.rank{grid-template-columns:1fr 80px 60px}.sectionhead{flex-wrap:wrap}#toast{left:12px;right:12px}}

@media print{body{background:#fff;color:#000;font-size:11pt}.top,.shell,#toast,.skip{display:none!important}#printout{display:block}#printout h1{font-size:24pt}#printout article{break-inside:avoid;padding:12px 0;border-bottom:1px solid #ccc}#printout h2{break-before:page}#printout a{color:#000}#printout .meta{font-size:9pt;color:#555}@page{margin:18mm}}

<script id="data" type="application/json">{"questions":[{"id":"Q001","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"887","statement":"O conceito legal de título de crédito associa o exercício do direito à literalidade e à autonomia, além de exigir o preenchimento dos requisitos legais.","answer":true,"explanation":"O art. 887 reúne documento necessário, direito literal e autônomo e observância dos requisitos da lei. A vontade das partes não dispensa o formalismo legal.","trap":"Elementos do conceito","complement":false},{"id":"Q002","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"888","statement":"Se a falta de um requisito legal retirar do documento sua validade como título de crédito, o negócio jurídico que lhe deu origem será necessariamente inválido.","answer":false,"explanation":"A perda da validade cambiária não implica invalidade do negócio causal. É possível que a obrigação de origem subsista, embora a cobrança tenha de seguir outra via.","trap":"Título versus negócio causal","complement":false},{"id":"Q003","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"889, caput","statement":"No regime geral do Código Civil, a data de emissão, a indicação precisa dos direitos conferidos e a assinatura do emitente devem constar do título.","answer":true,"explanation":"Esses são os requisitos mínimos enumerados no caput. A aplicação deve respeitar eventual disciplina diversa da lei especial, conforme o art. 903.","trap":"Requisitos mínimos","complement":false},{"id":"Q004","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"889, § 1º","statement":"No regime geral do Código Civil, a ausência de indicação do vencimento faz o título vencer trinta dias após sua emissão.","answer":false,"explanation":"O título sem indicação de vencimento é à vista. A lei não cria prazo automático de trinta dias.","trap":"Prazo inventado","complement":false},{"id":"Q005","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"889, § 2º","statement":"Aplicado o regime geral do Código Civil, a omissão dos lugares de emissão e pagamento é suprida pelo domicílio do emitente.","answer":true,"explanation":"O § 2º indica o domicílio do emitente para os lugares omitidos. Não se deve transportar essa regra automaticamente para espécies com disciplina especial.","trap":"Suprimento legal","complement":false},{"id":"Q006","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"889, § 3º","statement":"O Código Civil veda que um título de crédito seja emitido a partir de caracteres criados em computador, ainda que constem da escrituração do emitente.","answer":false,"explanation":"A emissão por computador ou meio técnico equivalente é expressamente admitida, com escrituração e observância dos requisitos mínimos do artigo.","trap":"Papel obrigatório","complement":false},{"id":"Q007","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"891, caput e parágrafo único","statement":"O preenchimento de título incompleto deve respeitar os ajustes realizados; o descumprimento não pode ser oposto ao terceiro que o adquiriu de boa-fé, no regime do Código Civil.","answer":true,"explanation":"O caput exige respeito ao pacto de preenchimento. O parágrafo único ressalva a oposição ao terceiro que agiu de má-fé ao adquirir o título.","trap":"Boa-fé e preenchimento","complement":false},{"id":"Q008","theme":"Teoria geral","ref":"cc","lesson":"Aula Títulos de crédito","article":"903","statement":"Havendo conflito entre regra do Código Civil sobre títulos de crédito e disposição de lei especial da espécie, deve prevalecer sempre o Código Civil.","answer":false,"explanation":"O art. 903 ressalva expressamente a disposição diversa da lei especial. A primeira pergunta é qual espécie e qual lei especial regem o título.","trap":"Inversão da hierarquia de aplicação","complement":false},{"id":"Q009","theme":"Teoria geral","ref":"cpc","lesson":"Aula Títulos de crédito","article":"783","statement":"Mesmo tratando-se de espécie legal de título executivo, a execução para cobrança exige obrigação certa, líquida e exigível.","answer":true,"explanation":"A inclusão da espécie no art. 784 não elimina os pressupostos gerais do art. 783. Vencimento e liquidez continuam relevantes.","trap":"Executividade automática","complement":false},{"id":"Q010","theme":"Teoria geral","ref":"cpc","lesson":"Aula Títulos de crédito","article":"784, I e III","statement":"Para que uma nota promissória seja título executivo extrajudicial, é indispensável que duas testemunhas a assinem, como ocorre na regra geral do documento particular.","answer":false,"explanation":"A nota promissória está autonomamente prevista no inciso I. A exigência de duas testemunhas do inciso III não integra os requisitos cambiários da nota.","trap":"Mistura de incisos","complement":false},{"id":"Q011","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"904","statement":"A transferência do título ao portador ocorre por simples tradição.","answer":true,"explanation":"Tradição é a entrega do título. Não se exige endosso como técnica de transferência dessa categoria.","trap":"Tradição versus endosso","complement":false},{"id":"Q012","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"907","statement":"É válida a emissão de título ao portador sem autorização de lei especial, desde que o emitente e o primeiro adquirente concordem.","answer":false,"explanation":"A autorização de lei especial é necessária; o art. 907 comina nulidade ao título ao portador emitido sem ela.","trap":"Autonomia da vontade","complement":false},{"id":"Q013","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"910, § 2º","statement":"No regime do Código Civil, a transferência por endosso completa-se com a tradição do título.","answer":true,"explanation":"A declaração de endosso e a entrega cumprem funções complementares. A mera assinatura, sem a tradição, não completa a transferência prevista nesse dispositivo.","trap":"Endosso e entrega","complement":false},{"id":"Q014","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"921","statement":"Para que um título seja nominativo no sentido técnico do Código Civil, basta que o nome do beneficiário esteja escrito na cártula.","answer":false,"explanation":"O nome precisa constar do registro do emitente. A identificação no próprio título caracteriza a noção mais ampla de título nominal e não basta para a categoria nominativa.","trap":"Nominal versus nominativo","complement":false},{"id":"Q015","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"922","statement":"O título nominativo pode ser transferido mediante termo no registro do emitente, assinado pelo proprietário e pelo adquirente.","answer":true,"explanation":"Esse é o modo de transferência expressamente previsto no art. 922. O art. 923 também disciplina a transferência por endosso e sua averbação.","trap":"Registro e assinaturas","complement":false},{"id":"Q016","theme":"Classificação","ref":"cc","lesson":"Aula Clássificação","article":"923, caput e § 1º","statement":"O endosso de título nominativo produz eficácia perante o emitente desde a assinatura, independentemente de averbação no registro.","answer":false,"explanation":"Embora se admita endosso com indicação do endossatário, sua eficácia perante o emitente depende da competente averbação no registro.","trap":"Eficácia perante o emitente","complement":false},{"id":"Q017","theme":"Classificação","ref":"cheque","lesson":"Aula Clássificação","article":"17, § 1º","statement":"Um cheque nominal com cláusula não à ordem somente se transmite pela forma e com os efeitos de cessão civil.","answer":true,"explanation":"A cláusula altera a técnica e os efeitos da circulação. Ela não torna o crédito absolutamente intransferível.","trap":"Não à ordem não é intransferível","complement":false},{"id":"Q018","theme":"Classificação","ref":"limite","lesson":"Aula Clássificação","article":"69","statement":"Um cheque de R$ 150,00 pode ser emitido e compensado sem identificação do beneficiário, porque a Lei do Cheque admite a modalidade ao portador.","answer":false,"explanation":"O art. 69 da Lei 9.069/1995 veda emissão, pagamento e compensação de cheque de valor superior a R$ 100,00 sem identificar o beneficiário. A permissão geral sofre esse limite.","trap":"Limite de valor","complement":false},{"id":"Q019","theme":"Classificação","ref":"duplicata","lesson":"Aula Clássificação","article":"2º e 20","statement":"A duplicata pode documentar livremente qualquer dívida, mesmo sem venda mercantil ou prestação de serviços, por ser título não causal.","answer":false,"explanation":"A duplicata é causal: sua emissão se vincula à operação de venda ou de serviços disciplinada na lei. Autonomia na circulação não libera a emissão sem causa legal.","trap":"Causalidade versus autonomia","complement":false},{"id":"Q020","theme":"Classificação","ref":"escritural","lesson":"Aula Clássificação","article":"2º e 3º","statement":"A adoção da forma escritural pela duplicata é compatível com sua vinculação à operação econômica que fundamenta a emissão.","answer":true,"explanation":"A Lei 13.775 permite a forma escritural para a duplicata da Lei 5.474. Muda o suporte e o modo de registro, preservando a espécie e sua causalidade.","trap":"Suporte versus causa","complement":false},{"id":"Q021","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"1º, item 2","statement":"A letra de câmbio contém uma promessa de pagamento feita diretamente pelo subscritor ao beneficiário.","answer":false,"explanation":"A letra contém uma ordem, ou mandato puro e simples, de pagar quantia determinada. A promessa direta caracteriza a nota promissória.","trap":"Ordem versus promessa","complement":false},{"id":"Q022","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"1º, itens 3 e 6","statement":"O nome de quem deve pagar e o nome da pessoa a quem ou à ordem de quem se deve pagar integram os requisitos da letra de câmbio.","answer":true,"explanation":"O art. 1º distingue sacado e tomador. Não se deve confundir destinatário da ordem com beneficiário do pagamento.","trap":"Troca dos sujeitos","complement":false},{"id":"Q023","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"1º, item 8","statement":"A assinatura exigida para a criação da letra de câmbio é a do sacado, ficando dispensada a assinatura do sacador.","answer":false,"explanation":"O requisito de emissão é a assinatura de quem passa a letra, o sacador. A assinatura do sacado relaciona-se ao aceite, que não é requisito da criação da letra.","trap":"Saque versus aceite","complement":false},{"id":"Q024","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"2º","statement":"A letra sem indicação da época de pagamento considera-se pagável à vista.","answer":true,"explanation":"Essa omissão é suprida pela própria LUG. Nem toda falta de menção do art. 1º torna a letra inválida.","trap":"Omissão suprível","complement":false},{"id":"Q025","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"2º","statement":"Não havendo indicação especial de lugar de pagamento na letra, considera-se como tal o lugar indicado ao lado do nome do tomador.","answer":false,"explanation":"O lugar relevante é o indicado ao lado do nome do sacado, considerado também seu domicílio. O item troca sacado por tomador.","trap":"Troca do ponto de referência","complement":false},{"id":"Q026","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"2º","statement":"Se a letra não indicar o lugar em que foi passada, considera-se emitida no lugar designado ao lado do nome do sacador.","answer":true,"explanation":"A regra supre a omissão do lugar do saque. Ela não supre, por si, todos os demais requisitos eventualmente ausentes.","trap":"Lugar do saque","complement":false},{"id":"Q027","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"1º e 2º","statement":"O art. 2º da LUG permite suprir automaticamente qualquer requisito omitido na letra, inclusive a assinatura do sacador.","answer":false,"explanation":"O suprimento legal é limitado às hipóteses previstas. A assinatura do sacador não está entre as omissões supridas automaticamente.","trap":"Generalização indevida","complement":false},{"id":"Q028","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"3º","statement":"É possível sacar uma letra de câmbio à ordem do próprio sacador.","answer":true,"explanation":"A LUG admite essa combinação de posições jurídicas. As posições de sacador e tomador não precisam ser ocupadas por pessoas diferentes.","trap":"Posições versus pessoas","complement":false},{"id":"Q029","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"3º","statement":"A letra de câmbio pode ser sacada sobre o próprio sacador ou por ordem e conta de terceiro.","answer":true,"explanation":"Ambas as possibilidades estão no art. 3º. A estrutura de ordem de pagamento não exige sempre três pessoas distintas.","trap":"Combinações de sujeitos","complement":false},{"id":"Q030","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"9º","statement":"O sacador da letra pode excluir por cláusula expressa tanto sua garantia de aceitação quanto sua garantia de pagamento.","answer":false,"explanation":"Pode exonerar-se da garantia de aceitação; a cláusula de exoneração da garantia de pagamento considera-se não escrita.","trap":"Aceitação versus pagamento","complement":false},{"id":"Q031","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"21","statement":"A letra pode ser apresentada ao aceite, até o vencimento, no domicílio do sacado, pelo portador ou mesmo por simples detentor.","answer":true,"explanation":"O art. 21 admite portador ou simples detentor. A apresentação ao aceite deve ser distinguida da apresentação para pagamento.","trap":"Legitimação para apresentar","complement":false},{"id":"Q032","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"22","statement":"A cláusula não aceitável significa que a letra somente poderá ser apresentada ao aceite no dia do vencimento.","answer":false,"explanation":"A cláusula proíbe a apresentação ao aceite, observadas as exceções legais. Não significa adiamento da apresentação para o vencimento.","trap":"Sentido da cláusula","complement":false},{"id":"Q033","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"22","statement":"O sacador pode determinar que a letra seja apresentada ao aceite e fixar prazo para isso.","answer":true,"explanation":"O art. 22 permite estipular apresentação obrigatória, com ou sem prazo. Isso é diferente de obrigar o sacado a aceitar.","trap":"Apresentar versus aceitar","complement":false},{"id":"Q034","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"22","statement":"O sacador pode proibir a apresentação ao aceite mesmo quando a letra for pagável a certo termo da vista.","answer":false,"explanation":"A letra a certo termo da vista é uma das exceções à faculdade de proibir apresentação, pois a vista é necessária para fixar o prazo.","trap":"Exceção à proibição","complement":false},{"id":"Q035","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"22","statement":"A letra pagável no domicílio de terceiro não pode receber do sacador proibição de apresentação ao aceite.","answer":true,"explanation":"O art. 22 ressalva a letra pagável no domicílio de terceiro, a pagável em localidade diversa do domicílio do sacado e a emitida a certo termo da vista.","trap":"Exceções legais","complement":false},{"id":"Q036","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"22","statement":"Um endossante pode exigir apresentação da letra ao aceite ainda que o sacador tenha declarado a letra não aceitável.","answer":false,"explanation":"A faculdade do endossante de estipular apresentação existe salvo se o sacador declarou a letra não aceitável.","trap":"Limite ao endossante","complement":false},{"id":"Q037","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"23","statement":"Em regra, a letra a certo termo da vista deve ser apresentada ao aceite dentro de um ano de sua data.","answer":true,"explanation":"O sacador pode reduzir ou ampliar o prazo. Os endossantes podem reduzi-lo. O prazo legal não é absolutamente imutável.","trap":"Prazo e possibilidade de alteração","complement":false},{"id":"Q038","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"23","statement":"Os endossantes podem ampliar o prazo de um ano para apresentação ao aceite da letra a certo termo da vista.","answer":false,"explanation":"A ampliação é permitida ao sacador. Aos endossantes o art. 23 permite reduzir o prazo, não ampliá-lo.","trap":"Competências diferentes","complement":false},{"id":"Q039","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"24","statement":"Pedida segunda apresentação pelo sacado, o portador deve aguardar trinta dias antes de apresentar novamente a letra.","answer":false,"explanation":"O sacado pode pedir nova apresentação no dia seguinte à primeira. Trinta dias não é o prazo desse dispositivo.","trap":"Troca de prazo","complement":false},{"id":"Q040","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"24","statement":"O portador não é obrigado a deixar a letra nas mãos do sacado quando a apresenta ao aceite.","answer":true,"explanation":"A LUG afasta esse dever. A possibilidade de pedir segunda apresentação não autoriza exigir a retenção da letra.","trap":"Apresentação versus entrega definitiva","complement":false},{"id":"Q041","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"25","statement":"O aceite da letra só é válido se contiver expressamente a palavra aceite, sendo insuficiente a simples assinatura do sacado no anverso.","answer":false,"explanation":"A simples assinatura do sacado na face anterior vale como aceite. A fórmula escrita não é indispensável nessa hipótese.","trap":"Formalidade excessiva","complement":false},{"id":"Q042","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"25","statement":"O aceite deve ser escrito na própria letra e assinado pelo sacado.","answer":true,"explanation":"A declaração cambiária de aceite integra o título. A regra admite a simples assinatura no anverso como forma suficiente.","trap":"Local da declaração","complement":false},{"id":"Q043","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"26","statement":"O aceite deve abranger necessariamente o valor integral da letra, sendo nulo o aceite limitado a parte da quantia.","answer":false,"explanation":"O sacado pode limitar o aceite a parte da importância. A exigência de aceite puro e simples não impede essa limitação quantitativa.","trap":"Aceite parcial","complement":false},{"id":"Q044","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"26","statement":"Uma modificação introduzida no aceite, diferente da limitação da importância, equivale a recusa; ainda assim, o aceitante fica obrigado nos termos de seu aceite.","answer":true,"explanation":"A LUG combina o efeito de recusa com a vinculação nos termos declarados. Não se deve concluir que toda modificação apaga qualquer obrigação.","trap":"Dois efeitos simultâneos","complement":false},{"id":"Q045","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"28","statement":"Pelo aceite, o sacado se obriga a pagar a letra no vencimento.","answer":true,"explanation":"O aceite torna o sacado devedor cambiário principal. A simples indicação de seu nome como destinatário da ordem não produz esse efeito.","trap":"Nascimento da obrigação principal","complement":false},{"id":"Q046","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"29","statement":"Uma vez lançado o aceite, o sacado não pode riscá-lo, mesmo antes de restituir a letra.","answer":false,"explanation":"A LUG admite cancelamento antes da restituição e presume que ele ocorreu antes dela, salvo prova em contrário. Existe ainda regra própria se o sacado comunicou o aceite por escrito.","trap":"Irretratabilidade absoluta","complement":false},{"id":"Q047","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"29","statement":"Se o sacado comunicou por escrito seu aceite ao portador, fica obrigado perante ele nos termos desse aceite, mesmo na hipótese de cancelamento tratada no artigo.","answer":true,"explanation":"A comunicação escrita é ressalva expressa ao regime do aceite riscado. O destinatário da comunicação recebe a proteção prevista na LUG.","trap":"Exceção à regra de cancelamento","complement":false},{"id":"Q048","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"33","statement":"A letra pode ser emitida com vencimentos sucessivos, desde que cada prestação e sua data estejam claramente discriminadas.","answer":false,"explanation":"A LUG considera nulas as letras com vencimentos sucessivos. Não se deve aplicar à letra a regra de parcelamento própria da duplicata.","trap":"Transposição entre espécies","complement":false},{"id":"Q049","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"33","statement":"São admitidos os vencimentos da letra à vista, a certo termo da vista, a certo termo da data e em dia fixado.","answer":true,"explanation":"O art. 33 enumera essas quatro modalidades e invalida letras com outros vencimentos ou vencimentos sucessivos.","trap":"Rol legal de vencimentos","complement":false},{"id":"Q050","theme":"Letra de câmbio","ref":"lug","lesson":"Aula Letra de Câmbio","article":"43","statement":"A recusa de aceite impede qualquer regresso do portador até que chegue a data originalmente prevista para o vencimento.","answer":false,"explanation":"A recusa total ou parcial de aceite permite exercer o regresso antes do vencimento, observados os pressupostos legais. Não se trata de cobrança contra sacado que nunca aceitou.","trap":"Regresso antecipado","complement":false},{"id":"Q051","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"75, item 2","statement":"A nota promissória deve conter promessa pura e simples de pagar quantia determinada.","answer":true,"explanation":"O próprio subscritor promete pagar. Não há ordem dirigida a um sacado, como na letra de câmbio.","trap":"Promessa direta","complement":false},{"id":"Q052","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"75, item 5","statement":"A nota promissória pode circular originariamente ao portador sem identificar a pessoa a quem ou à ordem de quem será paga.","answer":false,"explanation":"O nome do beneficiário integra os requisitos do art. 75. Não há suprimento automático desse requisito pelo art. 76.","trap":"Beneficiário obrigatório","complement":false},{"id":"Q053","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"75, itens 1 e 7","statement":"A denominação nota promissória deve constar do texto do título, na língua empregada, e o documento deve conter a assinatura do subscritor.","answer":true,"explanation":"São requisitos expressos. O modelo livre não significa liberdade para omitir menções legalmente exigidas.","trap":"Modelo livre versus formalismo","complement":false},{"id":"Q054","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"76","statement":"A falta de indicação do vencimento torna a nota promissória inválida em qualquer hipótese.","answer":false,"explanation":"A nota sem época de pagamento considera-se pagável à vista. Essa é uma das omissões expressamente supridas.","trap":"Omissão do vencimento","complement":false},{"id":"Q055","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"76","statement":"Sem indicação especial, o lugar da emissão da nota promissória considera-se também lugar do pagamento e domicílio do subscritor.","answer":true,"explanation":"É a regra específica da LUG. Ela não usa o domicílio do tomador como referência.","trap":"Lugar de pagamento","complement":false},{"id":"Q056","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"76","statement":"O lugar de emissão omitido na nota promissória é suprido pelo lugar indicado ao lado do nome do beneficiário.","answer":false,"explanation":"O lugar indicado ao lado do nome do subscritor é a referência legal. A questão troca devedor e beneficiário.","trap":"Troca de sujeito","complement":false},{"id":"Q057","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"75, item 6, e 76","statement":"A LUG supre a falta da data de emissão da nota promissória presumindo que corresponda à data de seu vencimento.","answer":false,"explanation":"Não existe esse suprimento no art. 76. A data de emissão integra os requisitos, e não se confunde com o lugar de emissão, cuja omissão tem regra própria.","trap":"Data versus lugar","complement":false},{"id":"Q058","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"78","statement":"O subscritor da nota promissória responde da mesma forma que o aceitante de uma letra de câmbio.","answer":true,"explanation":"Ele é devedor principal desde a subscrição. A equiparação de responsabilidade não cria um sacado na nota.","trap":"Equiparação sem identidade estrutural","complement":false},{"id":"Q059","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"78","statement":"O visto lançado na nota promissória a certo termo da vista equivale a aceite e constitui a obrigação principal do subscritor.","answer":false,"explanation":"O visto fixa o termo inicial do prazo. A obrigação principal já decorre da subscrição; a nota não comporta aceite como a letra.","trap":"Visto versus aceite","complement":false},{"id":"Q060","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"78 e 23","statement":"A nota promissória a certo termo da vista deve ser apresentada ao visto do subscritor nos prazos a que remete o art. 23.","answer":true,"explanation":"O art. 78 remete aos prazos de apresentação. O prazo-base é de um ano da data, sujeito às alterações admitidas pelo regime uniforme.","trap":"Remissão legal","complement":false},{"id":"Q061","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"78","statement":"Se o subscritor recusar o visto datado em nota a certo termo da vista, o prazo de vencimento ficará indefinidamente sem termo inicial.","answer":false,"explanation":"A recusa é comprovada por protesto, cuja data serve de ponto de partida para o termo de vista. A recusa não inviabiliza perpetuamente o vencimento.","trap":"Função do protesto","complement":false},{"id":"Q062","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"77 e 33","statement":"As quatro modalidades de vencimento previstas para a letra aplicam-se à nota promissória, no que forem compatíveis com sua natureza.","answer":true,"explanation":"O art. 77 remete às disposições sobre vencimento. A nota pode ser à vista, a termo da vista, a termo da data ou em dia fixado.","trap":"Aplicação por remissão","complement":false},{"id":"Q063","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"77 e 33","statement":"Uma nota promissória com vencimentos sucessivos é válida apenas porque contém promessa, e não ordem de pagamento.","answer":false,"explanation":"A regra do art. 33 sobre vencimentos aplica-se por remissão do art. 77. A diferença estrutural não autoriza vencimentos sucessivos na mesma nota.","trap":"Exceção inventada","complement":false},{"id":"Q064","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"77 e 70","statement":"A ação cambiária contra o subscritor da nota promissória prescreve em três anos contados do vencimento.","answer":true,"explanation":"Aplicam-se as disposições da prescrição da letra, e o subscritor responde como aceitante. Não se conta esse prazo principal da emissão ou do protesto.","trap":"Termo inicial","complement":false},{"id":"Q065","theme":"Nota promissória","ref":"lug","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"75 e 78","statement":"Na nota promissória, o beneficiário precisa apresentar o título a um terceiro sacado para que ele assuma a obrigação principal.","answer":false,"explanation":"Não existe sacado na estrutura da nota. O subscritor promete e se obriga diretamente ao pagamento.","trap":"Sujeito inexistente","complement":false},{"id":"Q066","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"1º, II e III","statement":"O cheque contém ordem incondicional de pagar quantia determinada dirigida a banco ou instituição financeira sacada.","answer":true,"explanation":"A estrutura é de ordem, e o sacado é o responsável pela operação de pagamento, sem assumir aceite cambiário.","trap":"Estrutura e sujeito","complement":false},{"id":"Q067","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"3º","statement":"Uma sociedade comercial que não seja banco nem instituição financeira equiparada pode ser sacada de cheque válido se tiver recursos do emitente.","answer":false,"explanation":"A emissão contra banco ou instituição equiparada é exigência legal, sob pena de o escrito não valer como cheque.","trap":"Qualidade do sacado","complement":false},{"id":"Q068","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"1º, VI","statement":"A assinatura obrigatória na emissão do cheque é a do gerente do banco sacado, podendo faltar a do correntista emitente.","answer":false,"explanation":"A lei exige assinatura do emitente ou de seu mandatário com poderes especiais. Banco sacado e emitente ocupam posições distintas.","trap":"Troca de assinaturas","complement":false},{"id":"Q069","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"2º, I","statement":"Se forem designados vários lugares junto ao nome do sacado, sem indicação especial do lugar de pagamento, o cheque é pagável no primeiro deles.","answer":true,"explanation":"É a ordem de suprimento do art. 2º, I. Não se escolhe automaticamente o último lugar nem o domicílio do portador.","trap":"Ordem das referências","complement":false},{"id":"Q070","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"2º, I","statement":"Sem indicação especial do lugar de pagamento e sem lugar designado junto ao nome do sacado, o cheque será sempre inválido.","answer":false,"explanation":"Nessa hipótese, a lei o considera pagável no lugar da emissão. Existe suprimento antes de se concluir pela invalidade.","trap":"Omissão suprível","complement":false},{"id":"Q071","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"2º, II","statement":"Sem indicação do lugar de emissão, o cheque considera-se emitido no lugar indicado junto ao nome do emitente.","answer":true,"explanation":"O ponto de referência é o emitente. Não é o lugar indicado ao lado do beneficiário.","trap":"Lugar da emissão","complement":false},{"id":"Q072","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"4º, caput","statement":"A insuficiência de fundos retira, por si só, a validade do título como cheque.","answer":false,"explanation":"O emitente deve ter fundos e autorização, mas a infração desses preceitos não prejudica a validade como cheque. A falta de fundos afeta o pagamento.","trap":"Validade versus pagamento","complement":false},{"id":"Q073","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"4º, § 1º","statement":"A existência de fundos disponíveis é verificada no momento da apresentação do cheque para pagamento.","answer":true,"explanation":"O marco legal é a apresentação. Não é suficiente analisar apenas o saldo no momento em que o cheque foi preenchido.","trap":"Momento da verificação","complement":false},{"id":"Q074","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"6º","statement":"O banco sacado pode aceitar o cheque e tornar-se devedor cambiário principal mediante assinatura de aceite no anverso.","answer":false,"explanation":"O cheque não admite aceite, e qualquer declaração nesse sentido considera-se não escrita. A regra difere da letra.","trap":"Importação do aceite","complement":false},{"id":"Q075","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"7º, caput","statement":"O visto ou certificação do cheque pode ser solicitado pelo emitente ou pelo portador legitimado e pressupõe cheque não ao portador e ainda não endossado.","answer":true,"explanation":"O dispositivo estabelece esses requisitos e prevê declaração datada no verso por quantia igual à indicada no título. Certificação não equivale a aceite.","trap":"Requisitos da certificação","complement":true},{"id":"Q076","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"7º, § 1º","statement":"A certificação do cheque exonera o emitente e os demais coobrigados de suas obrigações.","answer":false,"explanation":"A reserva da quantia em benefício do portador não exonera emitente, endossantes ou demais coobrigados. Não há substituição geral do devedor pelo banco.","trap":"Exoneração indevida","complement":true},{"id":"Q077","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"8º, I e II","statement":"O cheque pode indicar pessoa nomeada com ou sem cláusula expressa à ordem, ou indicar pessoa nomeada com cláusula não à ordem.","answer":true,"explanation":"São modalidades previstas no art. 8º. A cláusula não à ordem afeta a circulação, e não suprime o beneficiário.","trap":"Modalidades nominais","complement":false},{"id":"Q078","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"9º, I","statement":"É proibida a emissão de cheque à ordem do próprio sacador, porque emitente e beneficiário devem ser pessoas distintas.","answer":false,"explanation":"A lei admite cheque à ordem do próprio sacador. Posições jurídicas diferentes podem ser ocupadas pela mesma pessoa.","trap":"Identidade dos sujeitos","complement":true},{"id":"Q079","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"9º, III","statement":"O cheque pode ser emitido contra o próprio banco sacador, desde que não seja ao portador.","answer":true,"explanation":"É uma hipótese expressamente prevista, com a ressalva sobre a modalidade ao portador. Não se deve eliminar essa condição.","trap":"Exceção com condição","complement":true},{"id":"Q080","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"10","statement":"A estipulação de juros inserida no cheque é válida sempre que expressamente aceita pelo beneficiário.","answer":false,"explanation":"A cláusula de juros considera-se não escrita. O acordo não altera essa regra cambial do título.","trap":"Cláusula não escrita","complement":true},{"id":"Q081","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"12","statement":"Se o valor do cheque em algarismos divergir do valor por extenso, prevalece o valor por extenso.","answer":true,"explanation":"A regra não é escolher sempre o menor entre algarismos e extenso; a prioridade, nessa hipótese, é do extenso.","trap":"Critério de desempate","complement":true},{"id":"Q082","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"12","statement":"Se a quantia estiver indicada mais de uma vez por extenso, com divergência, prevalece a maior quantia.","answer":false,"explanation":"Havendo repetição divergente, por extenso ou em algarismos, prevalece a menor quantia. É hipótese distinta da divergência entre extenso e algarismos.","trap":"Maior versus menor","complement":true},{"id":"Q083","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"13, parágrafo único","statement":"A assinatura de pessoa capaz pode gerar obrigação no cheque mesmo que o título também contenha assinatura falsa de outra pessoa.","answer":true,"explanation":"As obrigações são autônomas e independentes. O vício da assinatura alheia não elimina automaticamente a obrigação válida do signatário capaz.","trap":"Autonomia das assinaturas","complement":false},{"id":"Q084","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"15","statement":"O emitente pode afastar sua garantia de pagamento do cheque inserindo cláusula expressa de exoneração.","answer":false,"explanation":"A garantia de pagamento é imposta ao emitente, e a cláusula exoneratória considera-se não escrita.","trap":"Garantia do emitente","complement":false},{"id":"Q085","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"32, caput","statement":"No plano cambial, o cheque é pagável à vista, e qualquer menção em contrário considera-se não escrita.","answer":true,"explanation":"A regra cambial permanece mesmo com pós-datação. Eventuais consequências civis do ajuste não transformam o cheque em título a prazo perante o sacado.","trap":"Plano cambial","complement":false},{"id":"Q086","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"32, parágrafo único","statement":"O banco está juridicamente impedido de pagar um cheque apresentado antes do dia nele indicado como data de emissão, ainda que existam fundos.","answer":false,"explanation":"O cheque apresentado antes da data indicada é pagável no dia da apresentação. A afirmação confunde ajuste entre as partes com a regra legal do pagamento.","trap":"Pós-datação","complement":false},{"id":"Q087","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"33","statement":"O prazo de apresentação do cheque emitido no lugar em que deve ser pago é de trinta dias, contado da emissão.","answer":true,"explanation":"O critério legal é o lugar de emissão em relação ao lugar de pagamento. Não é o domicílio atual do beneficiário.","trap":"Prazo da mesma praça","complement":false},{"id":"Q088","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"33","statement":"O cheque emitido no exterior e pagável no Brasil tem prazo de apresentação de noventa dias.","answer":false,"explanation":"A lei fixa sessenta dias para emissão em outro lugar do País ou no exterior. Noventa dias é prazo sem apoio nesse dispositivo.","trap":"Prazo do exterior","complement":false},{"id":"Q089","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"34","statement":"A apresentação do cheque à câmara de compensação equivale à apresentação para pagamento.","answer":true,"explanation":"O art. 34 atribui equivalência legal à compensação. Não se exige sempre entrega pessoal pelo portador no balcão do banco.","trap":"Equivalência legal","complement":true},{"id":"Q090","theme":"Cheque","ref":"cheque","lesson":"Aula Nota_Promissoria_e_Cheque_Revisada","article":"33","statement":"Se o cheque for emitido em cidade diversa daquela em que deva ser pago, mas ambas estiverem no mesmo estado, o prazo de apresentação será necessariamente de trinta dias.","answer":false,"explanation":"O critério não é a unidade da federação. Se emitido em outro lugar do País, aplica-se o prazo de sessenta dias, contado da emissão.","trap":"Cidade versus estado","complement":false},{"id":"Q091","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, caput","statement":"A emissão da fatura torna obrigatória, em todos os casos, a extração da duplicata pelo vendedor.","answer":false,"explanation":"O art. 2º dispõe que da fatura poderá ser extraída duplicata. Não se confunde a disciplina da fatura com obrigatoriedade universal de emitir duplicata.","trap":"Poderá versus deverá","complement":false},{"id":"Q092","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, § 2º","statement":"Uma só duplicata não pode corresponder a mais de uma fatura.","answer":true,"explanation":"A vedação é expressa. Não se permite agregar várias faturas em uma duplicata só por serem do mesmo comprador.","trap":"Unicidade da fatura","complement":false},{"id":"Q093","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, § 3º","statement":"Na venda parcelada, a lei obriga a emitir uma duplicata para cada prestação, vedando duplicata única.","answer":false,"explanation":"A lei oferece duas possibilidades: duplicata única discriminando prestações e vencimentos ou série de duplicatas, uma por prestação.","trap":"Alternativas legais","complement":false},{"id":"Q094","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, § 1º, III","statement":"A duplicata deve conter a data certa do vencimento ou a declaração de ser à vista.","answer":true,"explanation":"Essas são as menções previstas para o vencimento. Não se deve simplesmente reproduzir todas as modalidades da letra de câmbio.","trap":"Regra da espécie","complement":false},{"id":"Q095","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, § 1º, VII","statement":"A cláusula à ordem é elemento facultativo da duplicata e pode ser omitida sem contrariar a lista legal de requisitos.","answer":false,"explanation":"A cláusula à ordem integra expressamente o rol de requisitos da duplicata. A regra é própria da espécie.","trap":"Requisito obrigatório","complement":false},{"id":"Q096","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"2º, § 1º, V e IX","statement":"A duplicata deve indicar a importância em algarismos e por extenso e conter a assinatura do emitente.","answer":true,"explanation":"Ambas as exigências constam do rol legal. Não se confunde assinatura do emitente com o aceite a ser dado pelo comprador.","trap":"Valor e assinatura","complement":false},{"id":"Q097","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"6º, § 1º","statement":"O prazo de remessa da duplicata é de dez dias contados de seu vencimento.","answer":false,"explanation":"A remessa tem prazo de trinta dias contado da emissão. Dez dias aparece em etapas posteriores do fluxo, com outros marcos iniciais.","trap":"Troca de prazo e marco","complement":false},{"id":"Q098","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"6º, § 2º","statement":"Quando a remessa ocorre por intermediário, a apresentação ao comprador deve ocorrer em dez dias do recebimento do título na praça de pagamento.","answer":true,"explanation":"O prazo do intermediário não começa necessariamente na emissão. A lei toma por marco o recebimento na praça de pagamento.","trap":"Termo inicial do intermediário","complement":false},{"id":"Q099","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"7º, caput","statement":"A duplicata não à vista deve ser devolvida pelo comprador em trinta dias da apresentação, aceita ou com recusa escrita.","answer":false,"explanation":"O prazo é de dez dias da apresentação. A remessa em trinta dias é outro ato, previsto no art. 6º, § 1º.","trap":"Remessa versus devolução","complement":false},{"id":"Q100","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"7º, § 1º","statement":"O sacado pode reter a duplicata até o vencimento se houver expressa concordância da instituição financeira cobradora e comunicação escrita do aceite e da retenção.","answer":true,"explanation":"A retenção depende dessas condições. Não é simples faculdade unilateral do comprador de guardar o título sem avisar.","trap":"Retenção condicionada","complement":false},{"id":"Q101","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"8º","statement":"A falta de recursos do comprador é, por si só, motivo legal suficiente para recusar o aceite da duplicata de venda mercantil.","answer":false,"explanation":"O art. 8º trata de problemas na entrega, vícios ou diferenças comprovados e divergências nos prazos ou preços ajustados. Falta de recursos não integra o rol.","trap":"Motivo extralegal de recusa","complement":false},{"id":"Q102","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"8º, II e III","statement":"Diferenças comprovadas de quantidade e divergência em relação ao preço ajustado podem fundamentar recusa de aceite da duplicata.","answer":true,"explanation":"São hipóteses legais ligadas à operação causal. A recusa deve observar também prazo e forma legal.","trap":"Recusa vinculada à causa","complement":false},{"id":"Q103","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"8º, I","statement":"O não recebimento das mercadorias autoriza recusa de aceite em qualquer caso, mesmo quando elas foram expedidas por conta e risco do comprador.","answer":false,"explanation":"A hipótese legal de avaria ou não recebimento contém a ressalva relativa à conta e risco do comprador. O item elimina essa condição.","trap":"Supressão de ressalva","complement":false},{"id":"Q104","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"9º, caput","statement":"O comprador pode resgatar a duplicata antes do aceite e antes da data de vencimento.","answer":true,"explanation":"A lei autoriza o resgate antecipado. Aceite prévio não é condição obrigatória para que o devedor pague.","trap":"Pagamento antecipado","complement":false},{"id":"Q105","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"9º, § 1º","statement":"A prova de pagamento da duplicata exige recibo no próprio título, sendo vedado documento separado.","answer":false,"explanation":"A lei admite recibo no verso ou em documento separado com referência expressa à duplicata, passado pelo portador legítimo ou representante com poderes especiais.","trap":"Forma alternativa de quitação","complement":false},{"id":"Q106","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"11, parágrafo único","statement":"A prorrogação do vencimento da duplicata exige anuência expressa dos demais intervenientes para conservar sua coobrigação por endosso ou aval.","answer":true,"explanation":"O requisito protege os coobrigados da ampliação unilateral do prazo. Não basta a declaração do credor para mantê-los vinculados à prorrogação.","trap":"Conservação das garantias","complement":false},{"id":"Q107","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"12, parágrafo único","statement":"O aval prestado depois do vencimento da duplicata produz efeitos apenas de fiança civil.","answer":false,"explanation":"A lei atribui ao aval posterior os mesmos efeitos do aval anterior ao vencimento. Não há essa conversão automática em fiança.","trap":"Aval posterior","complement":false},{"id":"Q108","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"13, caput e § 1º","statement":"A duplicata pode ser protestada por falta de aceite, de devolução ou de pagamento, admitindo-se indicações do portador na falta de devolução.","answer":true,"explanation":"A ausência física decorrente de não devolução não inviabiliza o protesto. A técnica por indicação é prevista na própria lei.","trap":"Hipóteses de protesto","complement":false},{"id":"Q109","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"13, § 2º","statement":"A ausência de protesto por falta de aceite impede o posterior protesto por falta de pagamento da duplicata.","answer":false,"explanation":"O art. 13, § 2º, preserva a possibilidade de protesto por falta de pagamento mesmo sem protesto anterior por aceite ou devolução.","trap":"Preclusão inexistente","complement":false},{"id":"Q110","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"13, §§ 3º e 4º","statement":"Para preservar o regresso contra endossantes e seus avalistas, o portador deve tirar protesto regular em até trinta dias do vencimento, na praça de pagamento constante do título.","answer":true,"explanation":"A lei combina lugar e prazo. A perda prevista é do regresso contra esses coobrigados, não a extinção indistinta de toda obrigação representada.","trap":"Prazo e alcance da perda","complement":false},{"id":"Q111","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"15, I","statement":"Na cobrança do sacado, uma duplicata expressamente aceita exige sempre protesto para ter força executiva.","answer":false,"explanation":"O inciso I admite duplicata aceita, protestada ou não. Isso não dispensa observar regras próprias para preservar regresso contra outros obrigados.","trap":"Devedor principal versus regresso","complement":false},{"id":"Q112","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"15, II","statement":"A execução de duplicata não aceita exige, cumulativamente, protesto, prova hábil da entrega e recebimento e ausência de recusa válida nas condições legais.","answer":true,"explanation":"Não são requisitos alternativos. O credor precisa reunir as condições do inciso II, respeitando os arts. 7º e 8º quanto à recusa.","trap":"Requisitos cumulativos","complement":false},{"id":"Q113","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"15, II, b","statement":"A prova eletrônica de entrega e recebimento da mercadoria é insuficiente por natureza para execução de duplicata sem aceite, pois a lei exige prova exclusivamente física.","answer":false,"explanation":"A redação dada pela Lei 14.301/2022 permite expressamente comprovação por meio eletrônico. Isso não elimina os demais requisitos do inciso II.","trap":"Meio eletrônico admitido","complement":false},{"id":"Q114","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"15, § 2º","statement":"A duplicata não aceita e não devolvida pode ser executada mediante protesto por indicações, desde que cumpridas as condições legais do inciso II.","answer":true,"explanation":"A falta de devolução não torna a execução impossível. O protesto por indicação precisa ser acompanhado das demais condições.","trap":"Ausência da cártula","complement":false},{"id":"Q115","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"18, I","statement":"A pretensão executiva contra o sacado e seus avalistas prescreve em três anos contados do protesto da duplicata.","answer":false,"explanation":"O prazo de três anos começa no vencimento do título. Protesto é o marco de outra hipótese prescricional prevista na lei.","trap":"Marco inicial da prescrição","complement":false},{"id":"Q116","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"18, II e III","statement":"Contra endossante e seus avalistas, a pretensão executiva prescreve em um ano do protesto; entre coobrigados, em um ano do pagamento.","answer":true,"explanation":"Os prazos são iguais, mas os marcos iniciais são distintos. O regresso de quem pagou começa a partir do pagamento.","trap":"Mesmo prazo, marcos distintos","complement":false},{"id":"Q117","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"23","statement":"A perda da duplicata autoriza a emissão de triplicata apenas se o comprador concordar, e a nova cártula terá efeitos jurídicos inferiores aos da original.","answer":false,"explanation":"A perda ou extravio obriga o vendedor a extrair triplicata, com os mesmos efeitos, requisitos e formalidades. A lei não impõe essa concordância como condição.","trap":"Triplicata e equivalência","complement":false},{"id":"Q118","theme":"Duplicata","ref":"duplicata","lesson":"Aula Duplicata","article":"20, I e II, e 21","statement":"O Transportador Autônomo de Cargas previsto em lei pode emitir fatura e duplicata; a divergência nos prazos ou preços ajustados pode justificar a recusa de aceite da duplicata de serviços.","answer":true,"explanation":"O TAC foi incluído no art. 20 pela Lei 14.206/2021. A recusa relativa a serviços segue os motivos específicos do art. 21, inclusive prazo e preço.","trap":"Sujeitos e recusa em serviços","complement":false},{"id":"Q119","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"3º, caput e § 1º","statement":"Qualquer planilha particular do vendedor, sem sistema de escrituração gerido por entidade autorizada, basta para emitir duplicata escritural nos termos da Lei 13.775/2018.","answer":false,"explanation":"A emissão exige lançamento em sistema eletrônico de escrituração gerido por entidade autorizada. Uma planilha ou digitalização isolada não satisfaz esse regime.","trap":"Digitalização versus escrituração","complement":false},{"id":"Q120","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"4º, I, II e III","statement":"O sistema eletrônico deve registrar apresentação, aceite, devolução, prova do pagamento, titularidade e atos como endosso e aval.","answer":true,"explanation":"Esses aspectos integram o conteúdo mínimo da escrituração. O sistema não se limita a armazenar imagem da fatura.","trap":"Funções do sistema","complement":false},{"id":"Q121","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"4º, V","statement":"A inclusão de informações sobre ônus e gravames na duplicata escritural é sempre facultativa para o gestor.","answer":false,"explanation":"O inciso V integra a lista mínima de aspectos a escriturar. A integridade das informações sobre gravames faz parte da disciplina legal.","trap":"Obrigatório versus facultativo","complement":false},{"id":"Q122","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"5º, caput e parágrafo único","statement":"O pagamento total ou parcial ao legítimo credor, por meio do Sistema de Pagamentos Brasileiro, deve ser informado na escrituração com referência expressa à duplicata amortizada ou liquidada.","answer":true,"explanation":"A lei admite meios de pagamento do sistema e exige vincular a informação ao título correspondente. Registro e identificação são indispensáveis à prova organizada.","trap":"Vinculação do pagamento","complement":false},{"id":"Q123","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"6º, § 1º, III","statement":"O extrato da duplicata escritural deve conter cláusula à ordem, para permitir que ele próprio circule como novo título negociável independente.","answer":false,"explanation":"O extrato deve conter cláusula de inegociabilidade. Não se deve confundir o extrato do registro com uma segunda duplicata livremente circulável.","trap":"Título versus extrato","complement":false},{"id":"Q124","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"6º, § 2º","statement":"O extrato do registro da duplicata pode ser eletrônico, desde que observados requisitos de segurança que garantam a autenticidade.","answer":true,"explanation":"A lei não exige que todo extrato seja impresso. O requisito relevante para a forma eletrônica é a segurança e autenticidade.","trap":"Autenticidade versus papel","complement":false},{"id":"Q125","theme":"Duplicata escritural","ref":"escritural","lesson":"Aula Duplicata","article":"7º","statement":"Como a duplicata escritural e seu extrato são títulos executivos extrajudiciais, a cobrança judicial dispensa os requisitos do art. 15 da Lei 5.474/1968.","answer":false,"explanation":"O próprio art. 7º remete expressamente ao art. 15 para a cobrança. A forma escritural não elimina os requisitos conforme o título seja aceito ou não.","trap":"Executividade sem requisitos","complement":false}],"refs":{"cc":["Código Civil — Lei 10.406/2002","https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"],"cpc":["Código de Processo Civil — Lei 13.105/2015","https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105.htm"],"lug":["LUG — Decreto 57.663/1966, Anexo I","https://www.planalto.gov.br/ccivil_03/decreto/1950-1969/anexo/an57663-66.pdf"],"cheque":["Lei do Cheque — Lei 7.357/1985","https://www.planalto.gov.br/ccivil_03/leis/l7357.htm"],"limite":["Lei 9.069/1995","https://www.planalto.gov.br/ccivil_03/leis/l9069.htm"],"duplicata":["Lei das Duplicatas — Lei 5.474/1968","https://www.planalto.gov.br/ccivil_03/leis/l5474compilado.htm"],"escritural":["Duplicata escritural — Lei 13.775/2018","https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13775.htm"]}}</script>
<script>
'use strict';
const {questions:Q,refs:REF}=JSON.parse(document.getElementById('data').textContent);
const KEY='empresarial-ce-2026-v1',themes=[...new Set(Q.map(q=>q.theme))],byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={version:1,attempts:[],flags:[],notes:{}},view='questions',filter={theme:'',status:'all',search:'',order:'ordered',size:10},page=0,session=null;
let selected={},revealed=new Set(),retrying=new Set(),ranks={},toastTimer;
function validate(s){if(!s||s.version!==1||!Array.isArray(s.attempts)||!Array.isArray(s.flags)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes))throw Error('Formato incompatível');if(s.attempts.length>100000)throw Error('Histórico muito grande');for(const a of s.attempts){if(!a||!byId[a.id]||typeof a.answer!=='boolean'||!Number.isFinite(Date.parse(a.time)))throw Error('Tentativa inválida');}for(const id of s.flags)if(!byId[id])throw Error('Favorito inválido');for(const [id,n] of Object.entries(s.notes))if(!byId[id]||typeof n!=='string'||n.length>20000)throw Error('Anotação inválida');return {version:1,attempts:s.attempts.map(a=>({id:a.id,answer:a.answer,time:a.time,consulted:!!a.consulted})),flags:[...new Set(s.flags)],notes:{...s.notes}};}
try{const saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){$('storage-warning').innerHTML='<div class="notice">Não foi possível recuperar o progresso salvo. Se tiver um backup, importe-o em Fontes e uso. O treino continua disponível.</div>';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('storage-warning').innerHTML='<div class="notice">O navegador não permitiu salvar o progresso. Exporte um backup em Fontes e uso antes de fechar.</div>';}}
function toast(s){$('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3600);}
function attempts(id){return state.attempts.filter(a=>a.id===id);}
function last(id){return state.attempts.findLast(a=>a.id===id);}
function correct(a){return !!a&&a.answer===byId[a.id].answer;}
function pct(n,d){return d?Math.round(n/d*100)+'%':'—';}
function metrics(){const answered=Q.map(q=>last(q.id)).filter(Boolean),hits=answered.filter(correct).length;const first=Q.map(q=>state.attempts.find(a=>a.id===q.id)).filter(Boolean);return {answered:answered.length,hits,errors:answered.length-hits,firstErrors:first.filter(a=>!correct(a)).length};}
function statsHTML(){const m=metrics();return `<div class="grid metrics"><div class="metric"><div class="kicker">Questões respondidas</div><b>${m.answered}<span> / ${Q.length}</span></b><progress value="${m.answered}" max="${Q.length}" aria-label="Progresso"></progress></div><div class="metric ok"><div class="kicker">Acertos · última resposta</div><b>${pct(m.hits,m.answered)}</b><span>${m.hits} acertos em ${m.answered} respondidas</span></div><div class="metric err"><div class="kicker">Erros · última resposta</div><b>${pct(m.errors,m.answered)}</b><span>${m.errors} questões para retomar</span></div><div class="metric"><div class="kicker">Erros · primeira tentativa</div><b>${pct(m.firstErrors,m.answered)}</b><span>Repetições não apagam a primeira resposta</span></div></div>`;}
function normalized(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function pool(){return Q.filter(q=>{const a=last(q.id);return (!filter.theme||q.theme===filter.theme)&&(!session||session.includes(q.id))&&(!filter.search||normalized(q.statement+' '+q.article+' '+q.theme+' '+REF[q.ref][0]+' '+q.id).includes(normalized(filter.search)))&&(filter.status==='all'||filter.status==='new'&&!a||filter.status==='wrong'&&a&&!correct(a)||filter.status==='right'&&correct(a)||filter.status==='done'&&a||filter.status==='flags'&&state.flags.includes(q.id));}).sort((a,b)=>filter.order==='random'?(ranks[a.id]??0)-(ranks[b.id]??0):Q.indexOf(a)-Q.indexOf(b));}
function shuffle(){ranks={};Q.forEach(q=>ranks[q.id]=Math.random());}
function options(values,current){return values.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(current)?'selected':''}>${esc(l)}</option>`).join('');}
function questionHTML(q){const a=last(q.id),tries=attempts(q.id),re=retrying.has(q.id),show=(!re&&a)||revealed.has(q.id),choice=selected[q.id]??(!re&&a?a.answer:null);return `<article class="card question" id="${q.id}"><header class="qhead"><span class="qnum">${q.id}</span><span class="pill blue">${esc(q.theme)}</span><span class="pill">Autoral · C/E</span>${q.complement?'<span class="pill">Complemento legal</span>':''}<button data-action="flag" data-id="${q.id}" aria-pressed="${state.flags.includes(q.id)}" aria-label="Marcar ${q.id} para revisão">${state.flags.includes(q.id)?'★ Marcada':'☆ Marcar'}</button></header><p class="statement" id="s-${q.id}">${esc(q.statement)}</p>${!a||re?`<fieldset class="choices" aria-describedby="s-${q.id}"><legend>Julgue o item ${q.id}</legend>${[true,false].map(v=>`<label class="choice"><input type="radio" name="${q.id}" value="${v}" ${choice===v?'checked':''}>${v?'Certo':'Errado'}</label>`).join('')}<button class="primary answerbtn" data-action="answer" data-id="${q.id}">Responder</button><button class="linkbtn" data-action="reveal" data-id="${q.id}">Consultar gabarito</button></fieldset>`:`<div class="answerline">Sua resposta: <b>${a.answer?'Certo':'Errado'}</b> · ${tries.length} tentativa${tries.length>1?'s':''}${a.consulted?' · com consulta ao gabarito':''} <button class="linkbtn" data-action="retry" data-id="${q.id}">Tentar novamente</button></div>`}${show?`<section class="feedback ${a&&!re?(correct(a)?'good':'bad'):''}" aria-label="Correção"><h3>${a&&!re?(correct(a)?'✓ Você acertou.':'× Vamos corrigir.'):'Gabarito consultado.'} Resposta: ${q.answer?'Certo':'Errado'}.</h3><p class="legal">${esc(REF[q.ref][0])} · Art. ${esc(q.article)}</p><p>${esc(q.explanation)}</p><p class="trap"><b>Ponto de atenção:</b> ${esc(q.trap)}</p>${q.complement?'<p class="trap">Complemento: aprofundamento da leitura preparatória indicada na aula (arts. 1º a 35 da Lei do Cheque). Não se presume que este detalhe tenha sido ministrado ou será cobrado.</p>':''}<p class="source"><a href="${REF[q.ref][1]}" target="_blank" rel="noopener noreferrer">Conferir na fonte oficial ↗</a> · Base: ${esc(q.lesson.replaceAll('_',' '))}</p></section>`:''}<footer class="qfoot"><details><summary>Anotações${state.notes[q.id]?' •':''}</summary><label class="sr" for="note-${q.id}">Anotações de ${q.id}</label><textarea id="note-${q.id}" data-note="${q.id}" maxlength="20000" placeholder="Anote a palavra ou o prazo que confundiu você.">${esc(state.notes[q.id]||'')}</textarea></details><details><summary>Histórico (${tries.length})</summary>${tries.length?`<ol class="history">${tries.slice(-20).reverse().map(t=>`<li>${new Date(t.time).toLocaleString('pt-BR')} · ${t.answer?'C':'E'} · ${correct(t)?'acerto':'erro'}${t.consulted?' · consulta':''}</li>`).join('')}</ol>`:'<p>Nenhuma resposta registrada.</p>'}</details></footer></article>`;}
function renderQuestions(){return `<div class="pagehead"><div><div class="eyebrow">Direito Empresarial I / Títulos de crédito</div><h1>Leia a regra. Encontre a exceção.</h1><p class="muted">${Q.length} itens de certo ou errado para fixar a lei seca. Responda, confira o artigo e retome os pontos em que errou.</p></div><div class="date">SUA PROVA<strong>25 set 2026</strong>10 questões objetivas</div></div><div id="stats">${statsHTML()}</div><section class="card" aria-label="Filtros de questões"><div class="filters"><label class="field">Tema<select id="theme">${options([['','Todos os temas'],...themes.map(t=>[t,t])],filter.theme)}</select></label><label class="field">Situação<select id="status">${options([['all','Todas as questões'],['new','Não respondidas'],['wrong','Errei na última resposta'],['right','Acertei na última resposta'],['done','Respondidas'],['flags','Marcadas para revisar']],filter.status)}</select></label><label class="field">Buscar enunciado, artigo ou número<input id="search" type="search" value="${esc(filter.search)}" placeholder="Ex.: aceite, 33, Q042" autocomplete="off"></label></div><div class="toolrow"><label>Ordem <select id="order">${options([['ordered','Ordenada'],['random','Aleatória']],filter.order)}</select></label><label>Por página <select id="size">${options([[5,'5'],[10,'10'],[25,'25'],[200,'Todas']],filter.size)}</select></label><span class="spacer"></span><button data-action="font" aria-label="Aumentar tamanho do enunciado">A+</button><button data-action="clear">Limpar filtros</button><button data-action="ten">Treino de 10 itens</button><button data-action="print">Imprimir banco e gabarito</button></div></section>${session?'<div class="notes">Treino de 10 itens: correção imediata, sem cronômetro. <button class="linkbtn" data-action="end-session">Voltar ao banco completo</button></div>':''}<div id="question-list"></div><p class="foot">Questões autorais inspiradas no formato CESPE/Cebraspe, sem vínculo com a banca. Progresso salvo neste navegador; use o backup para levá-lo a outro dispositivo.</p>`;}
function list(){const all=pool(),pages=Math.max(1,Math.ceil(all.length/filter.size));page=Math.min(page,pages-1);const shown=all.slice(page*filter.size,(page+1)*filter.size);$('question-list').innerHTML=`<div class="resultbar"><span><b>${all.length}</b> questões encontradas${all.length?` · mostrando ${page*filter.size+1}–${page*filter.size+shown.length}`:''}</span><span>Selecione Certo ou Errado e clique em Responder.</span></div>${shown.length?shown.map(questionHTML).join(''):'<div class="empty"><h2>Nenhuma questão neste filtro.</h2><p>Altere o tema ou a situação para continuar.</p><button data-action="clear">Exibir todas as questões</button></div>'}<div class="pager"><button data-action="prev" ${page===0?'disabled':''}>← Anterior</button><span>Página ${page+1} de ${pages}</span><button data-action="next" ${page>=pages-1?'disabled':''}>Próxima →</button></div>`;}
function themeStats(){return themes.map(t=>{const qs=Q.filter(q=>q.theme===t),as=qs.map(q=>last(q.id)).filter(Boolean),err=as.filter(a=>!correct(a)).length;return {theme:t,total:qs.length,done:as.length,err,rate:as.length?err/as.length:0};});}
function dashboard(){const ts=themeStats().sort((a,b)=>b.err-a.err||b.rate-a.rate),m=metrics(),first=Q.map(q=>state.attempts.find(a=>a.id===q.id)).filter(Boolean),recovered=first.filter(a=>!correct(a)&&correct(last(a.id))).length;const batches=[];for(let i=0;i<state.attempts.length;i+=10){let b=state.attempts.slice(i,i+10);batches.push({start:i+1,end:i+b.length,n:b.length,h:b.filter(correct).length});}return `<div class="pagehead"><div><div class="eyebrow">Seu diagnóstico de estudo</div><h1>Onde vale revisar agora?</h1><p class="muted">O painel considera o banco completo. Os percentuais por tema usam apenas as questões respondidas.</p></div><button class="primary" data-action="review-errors">Revisar meus erros</button></div>${statsHTML()}<div class="grid two"><section class="card"><h2>Temas com mais erros</h2><p class="muted">Ordenados pela quantidade de erros na última resposta.</p>${ts.map(t=>`<div class="rank"><button data-topic="${esc(t.theme)}" title="Abrir erros deste tema">${esc(t.theme)}</button><div class="bar" aria-label="${esc(t.theme)}: ${pct(t.err,t.done)} de erros"><i style="width:${t.rate*100}%"></i></div><strong>${t.err} erros<br><span class="muted">${pct(t.err,t.done)}</span></strong></div>`).join('')}<p class="legend">Sem respostas: —. Uma taxa alta com poucas questões pede mais treino antes de concluir que o tema está dominado ou não.</p></section><section class="card"><h2>Mapa das ${Q.length} questões</h2><div class="chips"><span class="pill">Sem resposta</span><span class="pill" style="background:var(--greenbg)">✓ Último acerto</span><span class="pill" style="background:var(--redbg)">× Último erro</span></div><div class="map">${Q.map(q=>{let a=last(q.id);return `<button class="cell ${a?(correct(a)?'good':'bad'):''}" data-jump="${q.id}" title="${q.id} · ${esc(q.theme)} · ${a?(correct(a)?'Acerto':'Erro'):'Sem resposta'}" aria-label="${q.id}, ${a?(correct(a)?'acerto':'erro'):'sem resposta'}">${q.id.slice(1)}</button>`;}).join('')}</div><p class="le
