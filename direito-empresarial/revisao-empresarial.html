const MODULES=[
{id:'teoria',code:'TG',title:'Teoria geral',desc:'A função do crédito, os princípios e a escolha da lei aplicável.',aula:'Aula Títulos de crédito — slides 2–25',cards:[
{id:'t-funcao',title:'Por que o título existe?',body:'<p><b>Crédito</b> liga uma prestação presente a uma promessa futura. Entre elas há tempo e risco. O título facilita a circulação do crédito, a identificação do credor e a cobrança.</p><p>Na formulação de Vivante, o direito é literal e autônomo e seu exercício depende do documento. O <b>art. 887 do CC</b> também exige os requisitos legais. A ideia contemporânea de <b>registro das informações</b>, ensinada por Coelho, acomoda os títulos eletrônicos; é uma formulação doutrinária.</p><p>Características: formalidade, vocação circulatória, tipicidade, legitimação e eficácia executiva quando presentes os requisitos. Em regra, a entrega do título é <b>pro solvendo</b>: a obrigação causal não se extingue só pela entrega.</p>',trap:'“Receber um cheque já quita, necessariamente, a dívida.” Errado: em regra, a quitação depende do pagamento.',refs:['cc']},
{id:'t-historia',title:'Da viagem ao registro eletrônico',body:'<div class="inline-list"><div><b>Italiano</b><br>Até o séc. XVII: câmbio de moedas e deslocamento; carta entre banqueiros.</div><div><b>Francês</b><br>De 1673 ao séc. XIX: cláusula à ordem e circulação por endosso.</div><div><b>Alemão</b><br>Desde 1848: autonomia e abstração da obrigação cambiária.</div><div><b>Uniforme</b><br>Genebra, 1930: padronização internacional; promulgação brasileira em 1966.</div></div><p class="space">O Decreto 57.663/1966 incorpora a LUG com reservas. O Decreto 2.044/1908 continua relevante nos pontos remanescentes. Não houve simples apagamento de toda a legislação anterior.</p>',trap:'A sequência ensinada é câmbio → circulação → autonomia → uniformização. Os marcos históricos seguem o material do professor.',refs:['decreto','antigo']},
{id:'t-principios',title:'Os três princípios que resolvem casos',body:'<ul><li><b>Cartularidade:</b> no modelo clássico, posse e apresentação da cártula legitimam o exercício do direito. O regime eletrônico prevê mecanismos equivalentes.</li><li><b>Literalidade:</b> a extensão da obrigação cambiária resulta do conteúdo formal do título, conforme sua lei.</li><li><b>Autonomia:</b> as obrigações e posições cambiárias têm independência. Exceções pessoais são, em regra, inoponíveis ao terceiro protegido pela boa-fé.</li></ul><p><b>Abstração</b> diz respeito ao desprendimento da causa; <b>causalidade</b> classifica a emissão. Não use essas palavras como sinônimos absolutos. Entre partes originárias, a relação causal pode ser discutida.</p><p>Na LUG, art. 17, importa a aquisição consciente em detrimento do devedor; no cheque, ver art. 25. Boa-fé não elimina defesas objetivas nem todos os vícios possíveis.</p>',trap:'Autonomia não é imunidade a toda defesa. Pergunte sempre quem está cobrando e como recebeu o título.',refs:['cc','lug','cheque']},
{id:'t-fontes',title:'Lei especial primeiro; execução depois',body:'<p><b>Espécie → lei especial → remissões pertinentes → Código Civil subsidiário.</b> É a cautela do art. 903 do CC.</p><p>O <b>contrato</b> disciplina a relação obrigacional; o <b>título</b> organiza a circulação e a legitimação do crédito. Cessão civil e endosso não produzem necessariamente o mesmo regime de defesas.</p><p>A execução exige obrigação <b>certa, líquida e exigível</b> (CPC, art. 783). O art. 784, I, lista letra, nota, duplicata, debênture e cheque. Há documentos executivos que não são títulos de crédito. E a falta de validade cambiária não invalida automaticamente o negócio de origem (CC, art. 888).</p>',trap:'Ser uma espécie enumerada no CPC não torna qualquer exemplar incompleto ou inexigível imediatamente executável.',refs:['cc','cpc']},
{id:'t-suporte',title:'Papel, cópia digital e título eletrônico',body:'<ul><li><b>Cartular:</b> informações e atos na cártula.</li><li><b>Digitalizado:</b> imagem de um documento que continua sendo cartular.</li><li><b>Eletrônico/escritural:</b> emissão e circulação pelo sistema juridicamente previsto; a titularidade depende dos registros.</li></ul><p>A Lei 13.775/2018 é o exemplo central: a duplicata pode nascer no sistema, e seu extrato documenta as informações relevantes. A função econômica permanece, embora o mecanismo de legitimação mude.</p>',trap:'Escanear o título não muda seu suporte jurídico. “Modelo vinculado” também não significa “papel obrigatório”.',refs:['cc','escritural']}
]},
{id:'classe',code:'CL',title:'Classificação',desc:'Circulação, modelo, estrutura, causa e suporte: cinco perguntas.',aula:'Aula Clássificação — slides 3–13',cards:[
{id:'c-circulacao',title:'Como o crédito muda de titular?',body:'<ul><li><b>Ao portador:</b> tradição, isto é, entrega; depende de autorização de lei especial.</li><li><b>À ordem:</b> endosso e, no título cartular, tradição.</li><li><b>Não à ordem:</b> forma e efeitos de cessão civil; o cheque traz regra expressa no art. 17, § 1º.</li><li><b>Nominativo no CC:</b> nome do titular no registro do emitente; transferência conforme termo ou endosso seguido de averbação (arts. 921–923).</li></ul><p><b>Nominal</b> significa beneficiário identificado no título. Pode ser à ordem ou não à ordem. Cheque <b>superior a R$ 100</b> exige identificação do beneficiário (Lei 9.069/1995, art. 69).</p>',trap:'Nome no papel = nominal. Nome no registro do emitente = nominativo. Cheque de exatamente R$ 100 não está acima do limite.',refs:['cc','cheque','limite']},
{id:'c-modelo',title:'Modelo, estrutura e causa',body:'<ul><li><b>Livre:</b> letra e nota; a lei impõe requisitos, mas não formulário padronizado.</li><li><b>Vinculado:</b> cheque e duplicata; conformação mais rígida, compatível com formato escritural.</li><li><b>Ordem:</b> letra, cheque e duplicata; sacador dirige ordem ao sacado em favor do tomador.</li><li><b>Promessa:</b> nota promissória; o subscritor promete pagar diretamente.</li><li><b>Causal:</b> duplicata, cuja emissão exige causa típica de venda ou serviço.</li><li><b>Não causal:</b> letra, nota e cheque; não exigem causa típica predeterminada para a emissão.</li></ul>',trap:'“Não causal” não quer dizer “sem negócio subjacente”. “Livre” não quer dizer “sem requisitos legais”.',refs:['lug','cheque','dup']},
{id:'c-suporte',title:'Use os critérios separadamente',body:'<p>Um mesmo título recebe uma classificação em cada eixo. Exemplo: a <b>duplicata escritural</b> continua sendo causal, de modelo vinculado e estruturada como ordem de pagamento, mesmo sem papel.</p><p>O <b>cheque nominal</b> pode circular por endosso, salvo a cláusula não à ordem. Letra e nota são, em regra, à ordem. A técnica concreta depende da lei e das cláusulas admitidas.</p><p>Para classificar: <b>como circula? qual modelo? ordem ou promessa? causa típica? qual suporte?</b></p>',trap:'Não tire conclusões sobre causa, circulação ou modelo apenas porque o título é eletrônico.',refs:['cc','cheque','escritural']}
]},
{id:'letra',code:'LC',title:'Letra de câmbio',desc:'Da ordem do sacador ao aceite, vencimento e regresso.',aula:'Aula Letra de Câmbio — slides 2–16',cards:[
{id:'l-sujeitos',title:'Sacador → sacado → tomador',body:'<p><b>Sacador:</b> cria a ordem. <b>Sacado:</b> recebe a ordem. <b>Tomador:</b> beneficiário. São três posições jurídicas, que podem ser acumuladas nas hipóteses do art. 3º da LUG.</p><p>O sacado passa a <b>aceitante e devedor principal</b> ao aceitar. A mera indicação de seu nome não cria a obrigação cambiária.</p><p>O sacador garante aceitação e pagamento: pode excluir a garantia da <b>aceitação</b>, mas a cláusula que exclua a garantia de <b>pagamento</b> é considerada não escrita (art. 9º).</p>',trap:'Saque e aceite são atos diferentes. Não cobre o sacado como aceitante se o enunciado não informa aceite.',refs:['lug']},
{id:'l-requisitos',title:'Requisitos e omissões supríveis',body:'<p>O art. 1º da LUG enumera <b>oito itens</b>: denominação; ordem incondicional de pagar quantia determinada; sacado; vencimento; lugar do pagamento; tomador; data e lugar do saque; assinatura do sacador.</p><p>O slide conta nove elementos porque separa a quantia da ordem. O conteúdo é compatível, mas a numeração legal é oito.</p><ul><li>Sem vencimento: <b>à vista</b>.</li><li>Sem lugar especial do pagamento: lugar junto ao nome do <b>sacado</b>, também considerado seu domicílio.</li><li>Sem lugar do saque: lugar junto ao nome do <b>sacador</b>.</li></ul><p>Cambial em branco pode ser completada pelo credor de boa-fé <b>antes da cobrança ou protesto</b>, conforme o pacto (STF, Súmula 387; LUG, art. 10).</p>',trap:'Há omissões que a lei supre. Isso não autoriza inventar o beneficiário ou alterar livremente o pacto de preenchimento.',refs:['lug','s387','cc']},
{id:'l-aceite',title:'Aceite, recusa e aceite parcial',body:'<p>O aceite é lançado na própria letra e assinado pelo sacado; simples assinatura na face anterior pode bastar (art. 25). Ele é, em regra, facultativo. <b>Apresentação obrigatória não significa obrigação de aceitar.</b></p><p>A recusa pode permitir <b>regresso antes do vencimento</b>, observados protesto e demais pressupostos, contra os coobrigados. O sacado que recusou não vira devedor cambiário.</p><p><b>Limitativo:</b> aceita parte do valor e se obriga por ela. <b>Modificativo:</b> outra alteração equivale a recusa, mas o aceitante fica obrigado nos termos que declarou (art. 26).</p><p>O aceite riscado antes da restituição é, em regra, recusado (art. 29). Se o sacado já comunicou o aceite por escrito ao portador ou a outro signatário, obriga-se perante eles nos termos comunicados.</p>',trap:'Não marque “aceite absolutamente irretratável” nem “aceite parcial é sempre nulo”.',refs:['lug','recusa']},
{id:'l-apresentacao',title:'Apresentação ao aceite: leia a cláusula',body:'<p>Em regra, pode ocorrer até o vencimento. O sacador pode exigir apresentação ou proibi-la dentro dos limites da LUG.</p><p><b>Não aceitável:</b> proíbe apresentar ao aceite; a proibição não cabe, entre outras hipóteses do art. 22, na letra a certo termo da vista, pagável no domicílio de terceiro ou em localidade diferente do domicílio do sacado.</p><p><b>A certo termo da vista:</b> apresentação ao aceite em até <b>1 ano da data da letra</b>, salvo modulação válida. O sacador pode reduzir ou ampliar; endossantes podem reduzir (art. 23).</p><p>O sacado pode pedir segunda apresentação <b>no dia seguinte</b>; o portador não tem de deixar o título com ele (art. 24).</p>',trap:'“Não aceitável” não quer dizer “apresentável ao aceite somente no vencimento”. A data de apresentação para aceite não se confunde com pagamento.',refs:['lug']},
{id:'l-vencimento',title:'Quatro vencimentos; duas apresentações',body:'<div class="inline-list"><div><b>Dia certo</b><br>Data previamente indicada.</div><div><b>À vista</b><br>Pagamento na apresentação.</div><div><b>A termo da vista</b><br>Prazo contado do aceite ou do protesto cabível.</div><div><b>A termo da data</b><br>Prazo contado da emissão.</div></div><p class="space">Modalidades diversas e vencimentos sucessivos não são admitidos para a letra (art. 33). Após o vencimento, diferencie <b>apresentação ao pagamento</b> e <b>protesto</b>, prova solene do inadimplemento quando exigida.</p><p>Protesto e apresentação têm efeitos diferentes conforme a cobrança seja contra o devedor principal ou coobrigados. O protesto é central para conservar o regresso. A prescrição contra o aceitante é de <b>3 anos do vencimento</b> (art. 70).</p>',trap:'Não transporte para a letra a regra de parcelamento da duplicata. Não trate todos os obrigados como se ocupassem a mesma posição.',refs:['lug','antigo']}
]},
{id:'nota',code:'NP',title:'Nota promissória',desc:'Promessa direta, visto e os efeitos do contrato subjacente.',aula:'Aula Nota_Promissoria_e_Cheque_Revisada — slides 2–12',cards:[
{id:'n-forma',title:'O próprio emitente promete pagar',body:'<p><b>Subscritor/emitente</b> é o devedor principal; <b>tomador</b> é o beneficiário. Não existe sacado nem aceite. O subscritor responde como o aceitante da letra (art. 78).</p><p>Art. 75: denominação; promessa incondicional de pagar quantia determinada; vencimento; lugar do pagamento; tomador; data e lugar da emissão; assinatura do subscritor.</p><ul><li>Sem vencimento: à vista.</li><li>Sem lugar especial do pagamento: lugar da emissão, também considerado domicílio do subscritor.</li><li>Sem lugar de emissão: local indicado junto ao nome do subscritor.</li></ul><p>As lacunas supridas são as do art. 76. A nota em branco deve ser preenchida conforme o ajuste e a boa-fé, antes da cobrança ou protesto.</p>',trap:'O emitente é subscritor. Chamar esse sujeito de “sacador”, ou inventar um banco sacado, troca a estrutura da nota pela de outro título.',refs:['lug','s387']},
{id:'n-visto',title:'Visto não é aceite',body:'<p>A nota admite os quatro vencimentos da letra. Na nota <b>a certo termo da vista</b>, a apresentação ao subscritor busca um <b>visto datado</b>, que inicia a contagem.</p><p>Se o subscritor recusa o visto, o protesto fixa o marco legal. O visto não cria a obrigação: o emitente já está vinculado pela subscrição. Ver art. 78 da LUG.</p><p>A prescrição principal é de <b>3 anos a partir do vencimento</b>, por aplicação do art. 70 via art. 77.</p>',trap:'Ausência de aceite é característica da nota. Não se trata de falha que precise ser corrigida.',refs:['lug']},
{id:'n-contrato',title:'Vincular ao contrato não resolve tudo',body:'<p>Pergunte: <b>a nota circulou para terceiro de boa-fé?</b> E <b>a obrigação é certa, líquida e exigível?</b></p><p>A vinculação contratual pode comprometer a abstração, mas <b>não elimina automaticamente a executividade</b>. Uma obrigação determinada pode continuar executável. A nota não torna líquida, por mágica, uma dívida que depende de apuração.</p><p>O AgRg nos EDcl no REsp 1.043.911/MG, STJ, 3ª Turma, julgado em 21/06/2011, é o precedente pontual referido na aula; sua orientação é reproduzida em acórdão oficial posterior ligado abaixo.</p>',trap:'“Toda nota vinculada a qualquer contrato é inexequível” generaliza indevidamente a Súmula 258.',refs:['vinculo','cpc','s258']},
{id:'n-sumulas',title:'233, 247, 258 e 60: cada uma resolve um problema',body:'<ul><li><b>233/STJ:</b> contrato de abertura de crédito, mesmo acompanhado de extrato da conta, não é título executivo.</li><li><b>247/STJ:</b> abertura de crédito em conta-corrente com demonstrativo do débito pode instruir ação monitória.</li><li><b>258/STJ:</b> a nota vinculada à abertura de crédito não goza de autonomia por causa da iliquidez do título originário.</li><li><b>60/STJ:</b> é nula a obrigação cambiária assumida por procurador do mutuário vinculado ao mutuante, no exclusivo interesse deste.</li></ul><p>São súmulas de orientação consolidada; não são súmulas vinculantes do art. 103-A da Constituição. O CPC, art. 927, IV, prevê observância das súmulas do STJ em matéria infraconstitucional.</p>',trap:'Monitória e execução são vias diferentes. Na Súmula 60, observe a vinculação do procurador e o exclusivo interesse do credor, não apenas a existência de procuração.',refs:['s233','s247','s258','s60','cpc']}
]},
{id:'cheque',code:'CH',title:'Cheque',desc:'Ordem à vista, pós-datação e os prazos de apresentação.',aula:'Aula Nota_Promissoria_e_Cheque_Revisada — slides 14–20',cards:[
{id:'h-forma',title:'Correntista ordena; banco paga',body:'<p>No modelo ordinário da aula, o <b>emitente/sacador</b> é o correntista; <b>sacado</b>, o banco ou instituição equiparada; <b>beneficiário</b>, quem recebe. O emitente responde cambiariamente; o banco não se torna aceitante.</p><p>Requisitos do art. 1º: denominação cheque; ordem incondicional e quantia determinada; nome do sacado; lugar do pagamento; data e lugar de emissão; assinatura do emitente.</p><p>Pelo art. 2º, a falta de lugar especial de pagamento pode ser suprida pelo local junto ao nome do sacado; havendo vários, vale o primeiro; sem indicação, vale o lugar de emissão. Sem lugar de emissão, vale o indicado junto ao emitente.</p><p>O cheque <b>não admite aceite</b> (art. 6º); declaração de aceite é não escrita.</p>',trap:'Não confunda o banco que fornece o talonário com o emitente do cheque comum estudado na aula.',refs:['cheque']},
{id:'h-posdata',title:'Dois planos para o cheque pós-datado',body:'<p><b>Cambial:</b> sempre pagável à vista; menção contrária é não escrita. Se apresentado antes da data indicada, é pagável no dia da apresentação (art. 32).</p><p><b>Contratual:</b> o ajuste de apresentação futura pode gerar responsabilidade de quem o viola. A <b>Súmula 370/STJ</b>, Segunda Seção, julgada em 16/02/2009, reconhece dano moral na apresentação antecipada de cheque pré-datado.</p><p>A validade do pagamento bancário à vista e a responsabilidade de quem descumpre o pacto são perguntas distintas.</p>',trap:'Não escolha entre “à vista” e “responsabilidade civil” como se fossem incompatíveis. As duas conclusões podem coexistir.',refs:['cheque','s370']},
{id:'h-prazos',title:'30 ou 60 dias: o lugar importa',body:'<p>O prazo de <b>apresentação</b>, contado da emissão, é de <b>30 dias</b> no mesmo lugar em que será pago e <b>60 dias</b> se emitido em outro lugar do País ou no exterior (art. 33).</p><p>A apresentação tempestiva e a comprovação da recusa preservam o regresso contra endossantes e seus avalistas. A perda do prazo <b>não apaga automaticamente toda cobrança contra o emitente</b>.</p><p>O art. 47, § 3º, contém hipótese específica: emitente com fundos durante o prazo, perdidos depois por fato não imputável a ele. Não transforme a exceção em regra universal.</p><p>Circulação: pode ser nominal à ordem, não à ordem ou ao portador, observado o limite de R$ 100 para ausência de beneficiário.</p>',trap:'30 e 60 dias medem apresentação, não prescrição. A praça é o lugar jurídico de emissão/pagamento, não o nome do banco.',refs:['cheque','limite']},
{id:'h-extra',title:'Complemento: cobrança após a apresentação',extra:true,body:'<p><span class="pill gold">Complemento — aula anunciou aprofundamento posterior</span></p><p>A ação cambiária do art. 47 prescreve em <b>6 meses após o fim do prazo de apresentação</b> (art. 59). A ação de enriquecimento do art. 61 tem prazo de <b>2 anos após a prescrição cambiária</b>.</p><p>Não confunda prescrição da via cambial com desaparecimento de toda pretensão relacionada ao negócio. Estes detalhes ficam fora do banco de questões principal desta revisão, porque a aula disponível anuncia cobrança como continuidade.</p>',trap:'O prazo de seis meses não começa simplesmente na data em que o cheque foi emitido.',refs:['cheque']}
]},
{id:'dup',code:'DP',title:'Duplicata',desc:'Causa, aceite, execução e a passagem ao sistema escritural.',aula:'Aula Duplicata — slides 2–24',cards:[
{id:'d-emissao',title:'Negócio → fatura → duplicata',body:'<p>A duplicata exige <b>venda real ou serviço efetivamente prestado</b>. O vendedor/prestador é sacador e credor originário; o comprador/tomador é sacado; após a circulação, o portador pode ser terceiro.</p><p>Da fatura <b>pode</b> ser extraída duplicata. <b>Uma duplicata não corresponde a mais de uma fatura.</b> A Lei 5.474, art. 2º, § 3º, permite, no parcelamento, título único com prestações e vencimentos ou série de títulos, um por prestação. Na forma escritural, observar também a regulação específica do BCB.</p><p>O art. 2º, § 1º, exige: denominação, data e número; número da fatura; vencimento ou à vista; nome e domicílio das partes; valor em algarismos e por extenso; praça; cláusula à ordem; declaração para aceite; assinatura do emitente.</p>',trap:'Fatura documenta a operação; duplicata mobiliza o crédito; boleto é instrumento de cobrança. Nenhum deles vira automaticamente o outro.',refs:['dup','bcb']},
{id:'d-aceite',title:'Aceite e recusa justificada',body:'<p>Ao contrário da letra, a recusa da duplicata está vinculada a motivos legais. Na compra e venda, art. 8º:</p><ul><li>avaria ou não recebimento, quando entrega/transporte não ocorre por conta e risco do comprador;</li><li>vícios, defeitos ou diferenças de qualidade/quantidade, devidamente comprovados;</li><li>divergência dos prazos ou preços ajustados.</li></ul><p><b>30 dias da emissão:</b> remessa. <b>10 dias do recebimento na praça de pagamento:</b> intermediário apresenta ao comprador. <b>10 dias da apresentação:</b> devolução da duplicata não à vista, assinada ou com motivos escritos.</p><p>O art. 7º, § 1º, admite retenção com concordância expressa da instituição cobradora e comunicação escrita do aceite e da retenção.</p>',trap:'“Não quero aceitar” não é motivo legal. Os dois prazos de dez dias partem de eventos diferentes.',refs:['dup']},
{id:'d-pagar',title:'Pagamento, prorrogação e aval',body:'<p>É permitido resgatar antes do aceite ou vencimento. A prova pode ser recibo do legítimo portador ou representante com poderes especiais, no verso ou em documento separado que identifique a duplicata (art. 9º).</p><p>A reforma ou prorrogação exige declaração do vendedor/endossatário ou representante autorizado. Para manter a obrigação dos demais intervenientes por endosso ou aval, precisa da <b>anuência expressa deles</b> (art. 11).</p><p>O pagamento admite <b>aval</b>. O aval posterior ao vencimento produz os mesmos efeitos do anterior (art. 12).</p>',trap:'Prorrogar o título não conserva automaticamente todos os coobrigados. Aval posterior ao vencimento não perde eficácia só por ser posterior.',refs:['dup']},
{id:'d-execucao',title:'A tríade da execução sem aceite',body:'<p><b>Duplicata aceita:</b> executável contra o aceitante, protestada ou não, presentes os demais requisitos. Para regresso contra endossantes, não ignore as exigências próprias de protesto.</p><p><b>Duplicata não aceita, art. 15, II:</b> três requisitos cumulativos:</p><ol><li>protesto;</li><li>documento hábil que comprove entrega <b>e recebimento</b>, admitida prova eletrônica;</li><li>ausência de recusa comprovada, tempestiva e fundada nos arts. 7º e 8º.</li></ol><p>O protesto pode ocorrer por falta de aceite, devolução ou pagamento. A falta de devolução permite protesto por indicação. O protesto regular em <b>30 dias do vencimento</b> preserva o regresso contra endossantes e respectivos avalistas (art. 13, § 4º).</p>',trap:'Ter comprovante de entrega não dispensa protesto na execução da não aceita. A ausência da assinatura também não impede toda execução.',refs:['dup','protesto']},
{id:'d-prazos',title:'Prescrição, triplicata e serviços',body:'<ul><li><b>3 anos do vencimento:</b> contra sacado e respectivos avalistas.</li><li><b>1 ano do protesto:</b> contra endossante e seus avalistas.</li><li><b>1 ano do pagamento:</b> regresso de um coobrigado contra os demais.</li></ul><p>São prazos do art. 18. O art. 23 determina <b>triplicata</b> por perda ou extravio, com os mesmos requisitos, formalidades e efeitos da duplicata.</p><p>Serviços: empresas, fundações, sociedades e Transportador Autônomo de Cargas, nos termos legais (arts. 20–21). A recusa pode fundar-se em desconformidade do serviço, vícios comprovados ou divergência de prazo/preço.</p><p><b>Súmula 248/STJ</b>, Segunda Seção, 23/05/2001: prestação comprovada e duplicata de serviços protestada, ainda que sem aceite, podem instruir pedido de falência. Não dispensa os outros requisitos falimentares.</p>',trap:'Os prazos de um ano têm termos iniciais distintos. Triplicata não é o nome jurídico de qualquer fotocópia.',refs:['dup','s248']},
{id:'d-eletronica',title:'Cartular, virtual e escritural',body:'<p><b>Cartular:</b> papel. <b>Virtual:</b> expressão jurisprudencial histórica para cobrança sem emissão física, especialmente via protesto por indicação e documentação da operação. <b>Escritural:</b> título emitido originariamente em sistema eletrônico de escrituração autorizado.</p><p>No <b>EREsp 1.024.691/PR</b>, STJ, Segunda Seção, rel. Min. Raul Araújo, julgado em 22/08/2012, DJe 29/10/2012, o conjunto de dados/boleto, protesto por indicação e comprovação da operação admitiu cobrança executiva. É precedente colegiado, não repetitivo.</p><p>A Lei 13.775/2018 prevê registros de emissão, apresentação/aceite/recusa, titularidade, endosso, aval, ônus, pagamento e baixa. A duplicata escritural e seu <b>extrato</b> têm força executiva, observados os requisitos do art. 15 da Lei 5.474.</p><p>A Resolução BCB 339/2023 disciplina escrituração, registro, depósito e negociação. Na revisão, priorize o funcionamento jurídico do sistema, não uma data operacional de notícia.</p>',trap:'Boleto sozinho não é duplicata. Registro originário em sistema não equivale a digitalizar um documento em papel.',refs:['virtual','escritural','bcb']},
{id:'d-vicios',title:'Título sem causa e protesto indevido',body:'<p><b>Tema Repetitivo 465/STJ</b> e <b>Súmula 475</b>: quem recebe por endosso translativo título com vício formal e promove protesto indevido responde pelos danos, preservado o regresso contra endossantes e avalistas. Aplica-se à duplicata sem causa.</p><p>REsp 1.213.256/RS, Segunda Seção, rel. Min. Luis Felipe Salomão, julgamento em 28/09/2011, DJe 14/11/2011. É <b>precedente repetitivo</b>, de observância obrigatória pelo CPC, art. 927, III. Não confunda automaticamente endosso translativo e endosso-mandato.</p><p><b>Correção da aula:</b> o art. 172 do Código Penal vigente trata de emitir fatura, duplicata ou nota de venda que não corresponda à mercadoria vendida, em quantidade ou qualidade, ou ao serviço prestado. A redação antiga reproduzida no slide menciona “expedir ou aceitar”. A pena atual é detenção de 2 a 4 anos e multa.</p>',trap:'Autonomia não autoriza protestar duplicata sem lastro. Use a redação vigente do CP, preservando a distinção em relação ao slide.',refs:['t465','s475','penal','cpc']}
]}
];

const QUESTIONS=[];
function q(id,t,prompt,options,correct,explain,refs,card){QUESTIONS.push({id,t,prompt,options,correct,explain,refs,card});}
q('q01','teoria','Qual roteiro respeita o regime jurídico dos títulos de crédito?',['Aplicar o Código Civil antes de qualquer norma especial.','Identificar o título, sua lei especial e as remissões, usando o Código Civil subsidiariamente.','Aplicar a Lei do Cheque a todos os títulos.','Escolher livremente a norma mais favorável ao credor.'],1,'O art. 903 do CC preserva as disposições das leis especiais. A LUG, a Lei do Cheque e a Lei das Duplicatas têm campos próprios; o Código Civil não as substitui.',['cc'],'t-fontes');
q('q02','teoria','Uma duplicata em papel foi escaneada. A digitalização, por si só:',['Cria duplicata escritural.','Dispensa todos os requisitos de execução.','Gera imagem do título cartular, sem alterar seu suporte jurídico originário.','Torna o crédito não causal.'],2,'A origem jurídica continua cartular. A duplicata escritural nasce em sistema previsto pela Lei 13.775/2018. Suporte, causa de emissão e requisitos executivos são questões distintas.',['cc','escritural'],'t-suporte');
q('q03','teoria','A autonomia cambiária significa que:',['Todo vício se torna irrelevante depois do endosso.','O negócio de origem nunca pode ser discutido.','O crédito não possui causa econômica.','A posição do adquirente pode ser própria, com proteção contra exceções pessoais nos termos da lei e da boa-fé.'],3,'Autonomia não é ausência de causa nem exclusão de todas as defesas. A proteção do terceiro depende do regime aplicável; a LUG, art. 17, ressalva aquisição consciente em detrimento do devedor.',['lug','cc'],'t-principios');
q('q04','teoria','Sobre o conceito de título de crédito e a execução, assinale a correta.',['A força executiva não esgota o conceito; a execução exige obrigação certa, líquida e exigível.','Qualquer contrato é título de crédito.','A espécie mencionada no CPC é executável mesmo sem obrigação exigível.','Receber o título sempre extingue a obrigação causal.'],0,'O art. 783 do CPC exige certeza, liquidez e exigibilidade. A circulação e a legitimação também caracterizam o título. Em regra, a entrega é pro solvendo; contratos e títulos de crédito não se confundem.',['cpc','cc'],'t-fontes');
q('q05','classe','No sentido técnico do Código Civil, o título nominativo é aquele:',['Emitido necessariamente ao portador.','Que identifica o titular no registro do emitente.','Que traz qualquer nome escrito na cártula.','Que só pode ser eletrônico.'],1,'Os arts. 921–923 ligam o nominativo ao registro do emitente. A identificação do beneficiário no próprio título caracteriza o nominal, que pode ser à ordem ou não à ordem.',['cc'],'c-circulacao');
q('q06','classe','Um cheque com cláusula “não à ordem” transfere-se:',['Com os efeitos típicos do endosso em qualquer caso.','Somente por autorização judicial.','Com forma e efeitos de cessão civil.','Por mera entrega, sempre como título ao portador.'],2,'A Lei do Cheque, art. 17, § 1º, prevê os efeitos da cessão. A cláusula não torna o crédito intransferível nem transforma o cheque em título ao portador.',['cheque'],'c-circulacao');
q('q07','classe','Qual combinação corresponde à nota promissória, segundo a classificação ensinada?',['Modelo vinculado, ordem e emissão causal.','Modelo livre, ordem e emissão causal.','Modelo vinculado, promessa e emissão causal.','Modelo livre, promessa e emissão não causal.'],3,'A nota é promessa do subscritor, de modelo livre e sem causa típica legal necessária à emissão. Livre não dispensa os requisitos dos arts. 75–76 da LUG.',['lug'],'c-modelo');
q('q08','classe','Um cheque comum de R$ 150 pode ser emitido sem identificar o beneficiário?',['Não; a Lei 9.069/1995 exige identificação acima de R$ 100.','Sim; todo cheque é sempre ao portador.','Sim, desde que exista saldo.','Não, porque nenhum cheque de qualquer valor pode ser ao portador.'],0,'O art. 69 estabelece o limite superior a R$ 100. Saldo não afasta a identificação, mas também é incorreto proibir genericamente todo cheque ao portador.',['limite','cheque'],'c-circulacao');
q('q09','letra','Bruno foi indicado como sacado de uma letra, mas recusou o aceite. Qual conclusão está correta?',['Bruno já era devedor cambiário pelo simples saque.','A recusa é sempre ilícita.','Bruno não se vincula como aceitante; pode haver regresso antecipado contra coobrigados, com os requisitos legais.','A recusa extingue todas as obrigações dos signatários.'],2,'O sacado se vincula pelo aceite. A recusa pode abrir o regresso previsto no art. 43 da LUG, mas não cria a obrigação cambiária do recusante nem libera automaticamente os demais.',['lug','recusa'],'l-aceite');
q('q10','letra','O sacador declarou que não garante o pagamento da letra. Essa cláusula:',['É plenamente válida.','Transforma o sacado em devedor principal.','Exclui apenas o endossante.','Considera-se não escrita; a garantia de aceitação é que pode ser afastada.'],3,'Pelo art. 9º da LUG, o sacador pode exonerar-se da garantia de aceitação, mas não da garantia de pagamento. A cláusula não cria aceite.',['lug'],'l-sujeitos');
q('q11','letra','Em letra de R$ 10 mil, o sacado aceita apenas R$ 6 mil. O aceite:',['Vincula-o por R$ 6 mil e implica recusa quanto ao restante.','É necessariamente nulo.','Vincula-o por todos os R$ 10 mil.','Libera todos os coobrigados.'],0,'O art. 26 da LUG admite aceite limitado a parte da importância. A parcela recusada pode fundamentar regresso nos termos legais; não há vinculação do aceitante pelo total.',['lug'],'l-aceite');
q('q12','letra','A cláusula “não aceitável”, quando legalmente admissível:',['Determina aceite obrigatório.','Proíbe a apresentação ao aceite.','Autoriza apresentação ao aceite apenas no vencimento.','Proíbe apresentação para pagamento.'],1,'Ela se refere ao aceite, não ao pagamento. A possibilidade de inseri-la tem exceções no art. 22, como a letra a certo termo da vista.',['lug'],'l-apresentacao');
q('q13','letra','Sem modificação válida do prazo, uma letra a certo termo da vista deve ser apresentada ao aceite em:',['30 dias do vencimento.','60 dias do saque.','1 ano da data da letra.','3 anos da recusa.'],2,'É o prazo do art. 23 da LUG. O sacador pode reduzir ou ampliar, e endossantes podem reduzir. Não confundir com apresentação do cheque ou com prescrição.',['lug'],'l-apresentacao');
q('q14','letra','Uma letra não indica a época do pagamento, mas atende aos demais requisitos. Pela LUG:',['É sempre nula.','Vence em 30 dias.','Vence ao fim de um ano, sem apresentação.','É considerada pagável à vista.'],3,'O art. 2º supre a omissão do vencimento. Esse suprimento legal não se estende indistintamente a todos os requisitos do título.',['lug'],'l-requisitos');
q('q15','nota','Qual é o devedor principal da nota promissória?',['O subscritor ou emitente.','O banco sacado.','O tomador.','O sacado depois do aceite.'],0,'A nota contém promessa direta e tem subscritor e tomador. Não há sacado nem aceite. O art. 78 equipara a responsabilidade do subscritor à do aceitante da letra.',['lug'],'n-forma');
q('q16','nota','Na nota promissória a certo termo da vista, o visto:',['É o aceite indispensável para criar a dívida.','Serve para fixar o termo inicial do prazo, sem ser aceite.','É dado necessariamente pelo banco.','Substitui a assinatura de emissão.'],1,'A obrigação já decorre da subscrição. O visto datado é marco para o vencimento; a recusa pode ser constatada por protesto nos termos do art. 78.',['lug'],'n-visto');
q('q17','nota','Uma nota vinculada a contrato deve ser considerada automaticamente inexequível?',['Sim, em todo contrato.','Sim, mesmo com obrigação líquida e exigível.','Não; é necessário examinar a obrigação subjacente e as circunstâncias da circulação.','Não; notas são executáveis mesmo que a dívida seja ilíquida.'],2,'Vinculação não elimina por si a executividade. A Súmula 258 refere-se à abertura de crédito e à iliquidez originária. A existência de nota também não cura a iliquidez.',['s258','vinculo','cpc'],'n-contrato');
q('q18','nota','Qual leitura conjunta das Súmulas 233, 247 e 258/STJ está correta?',['Abertura de crédito com extrato é sempre título executivo.','A nota vinculada sempre torna líquido o saldo da abertura de crédito.','Monitória e execução são procedimentos idênticos.','A abertura de crédito não é executiva na hipótese sumulada, pode instruir monitória com demonstrativo e a nota vinculada sofre o problema da iliquidez.'],3,'A Súmula 233 trata da falta de executividade; a 247, da prova para monitória; e a 258, da ausência de autonomia da nota vinculada em razão da iliquidez.',['s233','s247','s258'],'n-sumulas');
q('q19','nota','Pela Súmula 60/STJ, é nula a obrigação cambial assumida:',['Por procurador do mutuário vinculado ao mutuante, no exclusivo interesse deste.','Por qualquer procurador, independentemente do vínculo e da finalidade.','Pelo próprio subscritor em toda operação bancária.','Em toda nota emitida com vencimento à vista.'],0,'O vício da hipótese sumulada envolve o conflito de interesses descrito. Não se pode generalizar a nulidade para toda procuração ou toda nota bancária.',['s60'],'n-sumulas');
q('q20','cheque','Sobre o aceite do cheque, assinale a correta.',['O banco precisa aceitar para pagar.','É vedado; declaração de aceite é considerada não escrita.','O tomador presta o aceite.','A pós-datação equivale ao aceite bancário.'],1,'O art. 6º da Lei do Cheque veda aceite. Banco sacado não se torna aceitante, e pós-datação diz respeito ao momento ajustado de apresentação.',['cheque'],'h-forma');
q('q21','cheque','O beneficiário apresenta antecipadamente cheque pós-datado. A conclusão adequada é:',['O banco é sempre impedido de pagar.','O cheque tornou-se título a prazo.','Ele continua pagável à vista, mas a apresentação antecipada pode gerar responsabilidade civil conforme a Súmula 370/STJ.','A natureza à vista elimina o acordo e toda responsabilidade de quem o descumpre.'],2,'O art. 32 rege o pagamento à vista. O pacto de pós-datação produz efeitos obrigacionais: a Súmula 370 reconhece dano moral na apresentação antecipada. São planos distintos.',['cheque','s370'],'h-posdata');
q('q22','cheque','Cheque emitido em local diverso daquele em que deve ser pago tem prazo de apresentação de:',['10 dias.','30 dias.','6 meses.','60 dias.'],3,'Art. 33: 30 dias no mesmo lugar e 60 dias em outro lugar do País ou no exterior, contados da emissão. Seis meses refere-se a outro instituto, fora do núcleo desta questão.',['cheque'],'h-prazos');
q('q23','cheque','A perda do prazo de apresentação do cheque:',['Pode comprometer o regresso, mas não elimina automaticamente toda pretensão contra o emitente ou toda dívida causal.','Extingue necessariamente o crédito contra todos.','Transforma o banco em aceitante.','Não tem nenhum efeito jurídico em qualquer hipótese.'],0,'A Lei do Cheque diferencia obrigados e condições do art. 47. O § 3º prevê hipótese específica quanto ao emitente que tinha fundos e os perdeu sem culpa; a regra não é extinção universal.',['cheque'],'h-prazos');
q('q24','cheque','Quem emite o cheque comum na estrutura estudada?',['O beneficiário ao apresentá-lo.','O correntista/sacador; o banco é sacado.','O banco, só porque fornece o talonário.','O tabelião ao protestá-lo.'],1,'O emitente dá a ordem e assina. O banco é o destinatário da ordem de pagamento. Fornecer formulário não se confunde com emitir a declaração cambiária do correntista.',['cheque'],'h-forma');
q('q25','dup','Mercadoria entregue e recebida; duplicata não aceita; ausência de recusa válida. Para executá-la, ainda é necessário:',['Aceite judicial do banco.','Trocar a duplicata por nota promissória.','Protesto, acompanhado da prova hábil da entrega e do recebimento.','Apenas apresentar um boleto.'],2,'O art. 15, II, exige cumulativamente protesto, prova de entrega/recebimento e ausência de recusa válida. A prova eletrônica é admitida. Boleto isolado não atende ao conjunto.',['dup'],'d-execucao');
q('q26','dup','Qual sequência de prazos da duplicata está correta?',['10 dias para remessa; 30 para devolução.','30 dias do vencimento para remessa e 10 da emissão para devolução.','Todos os atos devem ocorrer em 30 dias da emissão.','Remessa em 30 dias da emissão; intermediário apresenta em 10 dias do recebimento na praça; comprador devolve em 10 dias da apresentação.'],3,'Os arts. 6º–7º fixam três eventos distintos. A devolução referida é da duplicata não à vista, ressalvadas as hipóteses legais de retenção.',['dup'],'d-aceite');
q('q27','dup','O comprador pode recusar legitimamente o aceite da duplicata mercantil quando:',['Comprova vícios ou diferenças na quantidade/qualidade, nos termos legais.','Prefere livremente não pagar, mesmo sem defeito na operação.','Descobre que todo aceite é facultativo como o da letra.','O título foi endossado, por esse motivo isolado.'],0,'A recusa está vinculada ao art. 8º e deve observar prazo e forma. Incluem-se vícios comprovados, divergência de prazo/preço e avaria/não recebimento nas condições legais.',['dup'],'d-aceite');
q('q28','dup','A pretensão executiva contra o sacado e seus avalistas na duplicata prescreve em:',['1 ano do protesto.','3 anos do vencimento.','30 dias da apresentação.','1 ano do pagamento pelo coobrigado.'],1,'O art. 18, I, fixa três anos do vencimento. Um ano do protesto vale contra endossante e avalistas; um ano do pagamento, para regresso entre coobrigados.',['dup'],'d-prazos');
q('q29','dup','Sobre a duplicata escritural, qual afirmação está correta?',['É qualquer duplicata escaneada.','Dispensa a operação causal e os requisitos de cobrança.','Nasce em sistema de escrituração; o título e seu extrato são executivos observados os requisitos legais.','É o mesmo que boleto bancário isolado.'],2,'A Lei 13.775/2018 prevê emissão por lançamento em sistema. Seu art. 7º remete aos requisitos do art. 15 da Lei 5.474. O suporte eletrônico não dispensa lastro ou prova.',['escritural','dup'],'d-eletronica');
q('q30','dup','Um banco recebe por endosso translativo duplicata sem causa e promove protesto indevido. Segundo o Tema 465/STJ:',['A autonomia impede qualquer responsabilização do banco.','Apenas o sacado responde pelo vício.','O protesto cria a causa que faltava.','O endossatário responde pelos danos, preservado o regresso contra endossantes e avalistas.'],3,'O repetitivo REsp 1.213.256/RS, que originou a Súmula 475, alcança o título viciado, inclusive duplicata sem lastro. O regresso preservado não elimina a responsabilidade perante o lesado.',['t465','s475'],'d-vicios');

function head(kicker,title,desc){return `<header class="page-head"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></header>`;}
function topicOptions(value){return `<option value="all" ${value==='all'?'selected':''}>Todos os temas</option>`+MODULES.map(m=>`<option value="${m.id}" ${value===m.id?'selected':''}>${m.title}</option>`).join('');}
function wrongIds(){return QUESTIONS.filter(q=>state.answers[q.id]&&state.answers[q.id].correct===false).map(q=>q.id);}

function correctCount(){return QUESTIONS.filter(q=>state.answers[q.id]?.correct===true).length;}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function createSession(mode,ids){state.session={mode,ids,index:0,picks:{},graded:{},done:false,started:Date.now()};save();go('quiz');}
function startExam(){if(state.session&&!state.session.done){go('quiz');toast('Há uma sessão em andamento. Conclua ou encerre antes de iniciar outra.');return;}const distribution={teoria:1,classe:1,letra:2,nota:2,cheque:2,dup:2};const ids=MODULES.flatMap(m=>shuffle(QUESTIONS.filter(q=>q.t===m.id)).slice(0,distribution[m.id]).map(q=>q.id));createSession('exam',shuffle(ids));}
function startTrain(topic='all',onlyWrong=false){if(state.session&&!state.session.done){go('quiz');toast('Há uma sessão em andamento. Conclua ou encerre para trocar de treino.');return;}const ids=onlyWrong?wrongIds():QUESTIONS.filter(q=>topic==='all'||q.t===topic).map(q=>q.id);if(!ids.length){toast('Nenhum erro pendente para treinar.');return;}createSession('train',shuffle(ids));}
function grade(q,answer){state.answers[q.id]={answer,correct:answer===q.correct,tries:(state.answers[q.id]?.tries||0)+1};}
function feedbackHTML(q,pick){const right=pick===q.correct;return `<div class="feedback ${right?'':'wrong'}" role="status"><strong>${right?'✓ Resposta correta':'✕ Resposta incorreta'} · alternativa ${'ABCD'[q.correct]}</strong><p><b>${esc(q.options[q.correct])}</b></p><p>${esc(q.explain)}</p>${sources(q.refs,moduleFor(q.t).aula)}<button class="quiet backlink space" data-card="${q.card}">Revisar este ponto →</button></div>`;}

resultado do treino.'}</p><details><summary class="small muted">Encerrar esta sessão sem concluir</summary><p class="small muted">As respostas já corrigidas no treino permanecem no histórico. Respostas de simulado não finalizado não entram no desempenho.</p><button data-action="end-session">Encerrar e escolher outra prática</button></details></div>`;}
function finishQuiz(){const s=state.session;const missing=s.ids.filter(id=>s.mode==='exam'?s.picks[id]===undefined:!s.graded[id]);if(missing.length){toast(s.mode==='exam'?`Responda às ${missing.length} questões restantes antes de finalizar.`:`Confira as ${missing.length} respostas restantes antes de concluir.`);s.index=s.ids.indexOf(missing[0]);save();render();return;}if(s.mode==='exam')for(const id of s.ids){const q=questionFor(id);grade(q,s.picks[id]);s.graded[id]=true;}s.done=true;save();render();window.scrollTo({top:0,behavior:'instant'});}
function resultsHTML(s){const correct=s.ids.filter(id=>s.picks[id]===questionFor(id).correct).length;const misses=s.ids.filter(id=>s.picks[id]!==questionFor(id).correct);return head(s.mode==='exam'?'Simulado concluído':'Treino concluído','Confira seu resultado','Leia os comentários e retome os temas que precisam de mais uma passagem.')+`<div class="grid"><section class="card"><div class="label">Acertos nesta sessão</div><div class="score">${correct}<span class="thin"> / ${s.ids.length}</span></div><p>${misses.length?`${misses.length} ponto${misses.length===1?'':'s'} para retomar. Os erros já estão no seu radar de revisão.`:'Você acertou todas nesta rodada. Explique as regras sem olhar para testar a retenção.'}</p><div class="actions"><button class="primary" data-action="new-session">Escolher outra prática</button><button data-action="retry-session" ${misses.length?'':'disabled'}>Refazer erros desta sessão</button></div></section><section class="card"><h3>Desempenho por tema</h3>${MODULES.map(m=>{const qs=s.ids.map(questionFor).filter(q=>q.t===m.id);if(!qs.length)return '';const n=qs.filter(q=>s.picks[q.id]===q.correct).length;return `<div class="result-row"><span>${m.title}</span><progress max="${qs.length}" value="${n}" aria-label="${m.title}: ${n} de ${qs.length} acertos"></progress><b>${n}/${qs.length}</b></div>`;}).join('')}<p class="small muted space">Resultado desta sessão. O painel geral considera sua última resposta corrigida em cada questão.</p></section></div><div class="section-title"><h2>Gabarito comentado</h2></div>${s.ids.map((id,i)=>{const q=questionFor(id);return `<details class="card space" ${s.picks[id]!==q.correct?'open':''}><summary>${s.picks[id]===q.correct?'✓':'✕'} Questão ${i+1} · ${moduleFor(q.t).title}</summary><p><b>${esc(q.prompt)}</b></p><p class="small">Sua resposta: ${'ABCD'[s.picks[id]]} · ${esc(q.options[s.picks[id]])}</p>${feedbackHTML(q,s.picks[id])}</details>`;}).join('')}`;}
function flashDeck(){return FLASH.map((f,i)=>({f,id:i})).filter(({f})=>flashTopic==='all'||f[0]===flashTopic);}
function flashHTML(){const deck=flashDeck();if(flashIndex>=deck.length)flashIndex=0;const {f,id}=deck[flashIndex];const card=allCards.find(c=>c.id===f[3]);return head('Recordação ativa','Antes de virar, responda.','Diga a regra em voz alta ou mentalmente. Só depois confira a resposta e marque o que já consegue lembrar.')+`<div class="toolbar"><label class="field">Tema<select id="flash-topic">${topicOptions(flashTopic)}</select></label><span class="small muted">${state.flashKnown.filter(i=>Number.isInteger(i)&&i>=0&&i<FLASH.length).length} de ${FLASH.length} cartões dominados</span></div><div class="qpanel"><div class="row"><span class="pill">${moduleFor(f[0]).title}</span><span class="small muted">Cartão ${flashIndex+1} de ${deck.length}</span></div><section class="flash ${flashBack?'answer':''}" aria-live="polite"><div class="eyebrow">${flashBack?'Resposta':'Pergunta'}</div>${flashBack?`<p class="answer-copy">${esc(f[2])}</p>${sources(card.refs)}`:`<h2>${esc(f[1])}</h2>`}<div><button class="primary space" data-action="flip-card">${flashBack?'Voltar à pergunta':'Revelar resposta'}</button></div></section><div class="flash-footer"><button data-action="prev-card">← Anterior</button><button data-action="know-card" aria-pressed="${state.flashKnown.includes(id)}">${state.flashKnown.includes(id)?'✓ Já domino':'Marcar como dominado'}</button><button data-action="next-card">Próximo →</button></div><p class="small muted space">“Dominado” é uma autoavaliação. Você pode desmarcar ou voltar a qualquer cartão.</p><button class="quiet" data-card="${f[3]}">Abrir explicação completa →</button></div>`;}
function sourcesHTML(){return head('Rastreabilidade e precisão','Fontes da revisão','O conteúdo segue as cinco aulas fornecidas. A pesquisa de apoio e os links oficiais permitem conferir cada regra.')+`<section class="card"><h2>O que entrou no recorte</h2><ul>${MODULES.map(m=>`<li>${m.aula}</li>`).join('')}</ul><p class="small muted">Nota promissória e cheque foram separados para facilitar o estudo. Os cadernos de questões e o Material de apoio serviram como complementos. O banco contém 30 questões autorais, não uma transcrição da prova.</p><p class="small muted">Base jurídica: pesquisa de 19/09/2026. Detalhes complementares de cobrança do cheque estão identificados no conteúdo e fora do banco principal.</p></section><section class="card space"><h2>Ajustes que merecem atenção</h2><details open><summary>Art. 172 do Código Penal: redação antiga no slide</summary><p>A aula menciona “expedir ou aceitar”. O texto vigente se refere à emissão de fatura, duplicata ou nota de venda desconforme à mercadoria ou serviço. A revisão adota a redação atual, com detenção de 2 a 4 anos e multa.</p>${sources(['penal'])}</details><details><summary>Letra: oito itens legais, nove elementos no slide</summary><p>O art. 1º da LUG reúne a quantia determinada na ordem de pagamento. A aula separa esses elementos didaticamente. Não há diferença material nos requisitos por esse motivo.</p>${sources(['lug'])}</details><details><summary>Atualização operacional das duplicatas escriturais</summary><p>A aula menciona uma notícia do Banco Central de 03/07/2026, enquanto a pesquisa anterior registra outro marco operacional em julho. Notícias e início operacional não são necessariamente o mesmo evento. A página dinâmica do comunicado não retornou texto verificável nesta montagem; por isso, nenhuma data operacional é cobrada nas questões. Estude a Lei 13.775/2018 e a regulação vigente.</p>${sources(['bcb','escritural'])}</details><details><summary>RE 71.154/PR: limite da verificação</summary><p>É referência histórica mencionada pelo professor. O inteiro teor oficial não foi confirmado na pesquisa; não atribuímos tese específica a esse julgamento. A promulgação interna da LUG é demonstrada pelo Decreto 57.663/1966.</p>${sources(['decreto'])}</details></section>
<section class="card space"><h2>Jurisprudência essencial</h2><div class="note info">Súmulas comuns do STF/STJ não são súmulas vinculantes do art. 103-A da Constituição. Ainda assim, o CPC, art. 927, IV, prevê observância das súmulas pertinentes. O Tema 465 é repetitivo, abrangido pelo art. 927, III. Precedentes pontuais não têm o mesmo regime.</div>${JURIS.map(j=>`<div class="source-item"><a href="${REF[j[0]][1]}" target="_blank" rel="noopener noreferrer"><b>${j[1]} ↗</b></a><p>${j[2]}</p></div>`).join('')}</section><section class="card space"><h2>Legislação e regulação</h2>${['cc','cpc','lug','decreto','antigo','cheque','limite','dup','escritural','protesto','penal','bcb'].map(k=>`<div class="source-item">${refLinks([k])}</div>`).join('')}</section><section class="card space"><h2>Seu caderno</h2><p>Conteúdo, questões, cartões e correção estão dentro deste único arquivo. Não há fontes, bibliotecas ou serviços externos necessários para estudar. Os links oficiais abrem na internet.</p><p class="small muted">Anotações, marcações e respostas são guardadas neste navegador. Ao trocar de navegador, apagar os dados ou mover o arquivo, a disponibilidade desse progresso pode variar.</p><div class="actions"><button data-action="print">Imprimir revisão completa</button><button data-action="export-progress">Baixar backup do progresso</button></div><label class="field space">Restaurar backup JSON<input type="file" id="import-progress" accept="application/json,.json"></label><details><summary>Apagar meu progresso</summary><p>Isso remove marcações, anotações, respostas e sessão atual deste navegador. O conteúdo da revisão continua disponível.</p><button data-action="reset-progress">Confirmar apagamento do progresso</button></details></section>`;}
function openCard(id){const c=allCards.find(c=>c.id===id);if(!c)return;studyFilter=c.t;studySearch='';studyOnlyMarks=false;go('study');const node=document.getElementById('card-'+id);node?.scrollIntoView({block:'start',behavior:'instant'});}
function printAll(){document.getElementById('print-sheet').innerHTML=`<h1>Direito Empresarial · revisão</h1><p>Prova: 25/09/2026 · Conteúdo das cinco aulas · Base pesquisada em 19/09/2026</p>${comparisonHTML()}${deadlineHTML()}${MODULES.map(m=>`<section><h2>${m.title}</h2><p>${m.aula}</p>${m.cards.map(c=>`<article><h3>${c.title}</h3><div class="body-copy">${c.body}</div><div class="trap"><b>Pegadinha:</b> ${c.trap}</div>${sources(c.refs)}</article>`).join('')}</section>`).join('')}<h2>Jurisprudência para reconhecer</h2>${JURIS.map(j=>`<article><h3>${j[1]}</h3><p>${j[2]}</p>${sources([j[0]])}</article>`).join('')}<p>Complementos estão identificados. Os prazos operacionais do BCB e o RE 71.154/PR não são usados como fundamento de questões, pelas limitações registradas na seção Fontes.</p>`;window.print();}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){go(b.dataset.view);return;}
 if(b.dataset.topic){studyFilter=b.dataset.topic;studySearch='';studyOnlyMarks=false;go('study');return;}
 if(b.dataset.card){openCard(b.dataset.card);return;}
 if(b.dataset.mark){const id=b.dataset.mark;if(state.marks.includes(id))state.marks=state.marks.filter(x=>x!==id);else state.marks.push(id);save();b.setAttribute('aria-pressed',state.marks.includes(id));b.textContent=state.marks.includes(id)?'★ Marcado para rever':'☆ Rever depois';toast(state.marks.includes(id)?'Adicionado aos tópicos para rever.':'Marcação removida.');return;}
 if(b.dataset.trainTopic){startTrain(b.dataset.trainTopic);return;}
 if(b.dataset.qindex!==undefined){state.session.index=Number(b.dataset.qindex);save();render();return;}
 const a=b.dataset.action,s=state.session;
 if(a==='open-study')go('study');
 if(a==='open-attention')go('attention');
 if(a==='start-exam')startExam();
 if(a==='start-train')startTrain(quizTopic);
 if(a==='retry-wrong')startTrain('all',true);
 if(a==='toggle-deadlines'){deadlinesHidden=!deadlinesHidden;const y=window.scrollY;render();window.scrollTo(0,y);}
 if(a==='prev-q'||a==='next-q'){s.index+=a==='prev-q'?-1:1;save();render();}
 if(a==='check-answer'){const q=questionFor(s.ids[s.index]);if(s.picks[q.id]===undefined)return;s.graded[q.id]=true;grade(q,s.picks[q.id]);save();render();}
 if(a==='finish-quiz')finishQuiz();
 if(a==='end-session'||a==='new-session'){state.session=null;save();render();window.scrollTo(0,0);}
 if(a==='retry-session'){const ids=s.ids.filter(id=>s.picks[id]!==questionFor(id).correct);createSession('train',shuffle(ids));}
 if(a==='flip-card'){flashBack=!flashBack;render();}
 if(a==='prev-card'||a==='next-card'){const n=flashDeck().length;flashIndex=(flashIndex+(a==='next-card'?1:-1)+n)%n;flashBack=false;render();}
 if(a==='know-card'){const id=flashDeck()[flashIndex].id;if(state.flashKnown.includes(id))state.flashKnown=state.flashKnown.filter(x=>x!==id);else state.flashKnown.push(id);save();render();}
 if(a==='print')printAll();
 if(a==='export-progress'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='progresso-empresarial.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 if(a==='reset-progress'){state=fresh();save();render();toast('Progresso apagado.');}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='study-search'){studySearch=t.value;$('#study-results').innerHTML=studyResultsHTML();}if(t.dataset.notes){state.notes[t.dataset.notes]=t.value;save();}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='study-filter'){studyFilter=t.value;$('#study-results').innerHTML=studyResultsHTML();}
 if(t.id==='only-marks'){studyOnlyMarks=t.checked;$('#study-results').innerHTML=studyResultsHTML();}
 if(t.dataset.reviewed){const id=t.dataset.reviewed;if(t.checked&&!state.reviewed.includes(id))state.reviewed.push(id);if(!t.checked)state.reviewed=state.reviewed.filter(x=>x!==id);save();toast(t.checked?'Tema marcado como revisado.':'Tema voltou para a revisão.');}
 if(t.id==='quiz-topic')quizTopic=t.value;
 if(t.name==='answer'){const s=state.session,q=questionFor(s.ids[s.index]);if(s.graded[q.id])return;s.picks[q.id]=Number(t.value);save();const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`input[name=answer][value="${t.value}"]`)?.focus({preventScroll:true});}
 if(t.id==='flash-topic'){flashTopic=t.value;flashIndex=0;flashBack=false;render();}
 if(t.id==='import-progress'&&t.files[0]){try{const file=t.files[0];if(file.size>2000000)throw Error('Arquivo muito grande.');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.reviewed)||!Array.isArray(data.marks)||!data.answers||!data.notes||typeof data.answers!=='object'||typeof data.notes!=='object')throw Error('Formato incompatível.');const restored=fresh();restored.reviewed=data.reviewed.filter(id=>MODULES.some(m=>m.id===id));restored.marks=data.marks.filter(id=>allCards.some(c=>c.id===id));restored.flashKnown=(Array.isArray(data.flashKnown)?data.flashKnown:[]).filter(id=>Number.isInteger(id)&&id>=0&&id<FLASH.length);for(const m of MODULES)if(typeof data.notes[m.id]==='string')restored.notes[m.id]=data.notes[m.id];for(const q of QUESTIONS){const a=data.answers[q.id];if(a&&Number.isInteger(a.answer)&&a.answer>=0&&a.answer<q.options.length)restored.answers[q.id]={answer:a.answer,correct:a.answer===q.correct,tries:Math.max(1,Number(a.tries)||1)};}state=restored;save();render();toast('Backup restaurado. Inicie uma nova sessão de questões.');}catch(err){toast('Não foi possível importar. Escolha um backup JSON desta revisão.');}}
});
$('#print-button').addEventListener('click',printAll);
render();
</script>
</body>
</html>
