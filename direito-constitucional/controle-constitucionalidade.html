  --ce:#2347B8; --me:#8E1F4A; --disc:#3F6B2A;
  --ok:#1E7A3A; --ok-bg:#E3F4E6; --err:#B42318; --err-bg:#FDE8E6;
  --warn:#7A4D00; --warn-bg:#FFF1CC; --warn-line:#E0A100; --info:#1F5FAD; --info-bg:#E5EFFB;

}
@media (prefers-color-scheme: dark) {

    --bg:#17191C; --surface:#1F2226; --ink:#ECEDE8; --muted:#A4A8AD; --line:#33373C;
    --ce:#8FA8FF; --me:#F08BB4; --disc:#9CCB7E;
    --ok:#6FD38C; --ok-bg:#1C3324; --err:#FF8A7E; --err-bg:#3A1F1C;
    --warn:#FFD36B; --warn-bg:#3A2F12; --warn-line:#C99A1E; --info:#8DBBFF; --info-bg:#1B2A40;
    --g1:#4A4410; --i1:#FFF27A; --g2:#4D2236; --i2:#FFC2DD; --g3:#1F4128; --i3:#B9F0C4;
    --g4:#4A2E14; --i4:#FFD3A8; --g5:#18384F; --i5:#BFE3FF; --g6:#352A54; --i6:#DCCBFF;

  }
}
:root[data-modo="escuro"] {
  --bg:#17191C; --surface:#1F2226; --ink:#ECEDE8; --muted:#A4A8AD; --line:#33373C;
  --ce:#8FA8FF; --me:#F08BB4; --disc:#9CCB7E;
  --ok:#6FD38C; --ok-bg:#1C3324; --err:#FF8A7E; --err-bg:#3A1F1C;
  --warn:#FFD36B; --warn-bg:#3A2F12; --warn-line:#C99A1E; --info:#8DBBFF; --info-bg:#1B2A40;
  --g1:#4A4410; --i1:#FFF27A; --g2:#4D2236; --i2:#FFC2DD; --g3:#1F4128; --i3:#B9F0C4;
  --g4:#4A2E14; --i4:#FFD3A8; --g5:#18384F; --i5:#BFE3FF; --g6:#352A54; --i6:#DCCBFF;
  --g7:#123F3B; --i7:#A8EDE6; --g8:#4A2A20; --i8:#F5C9B8; --g9:#333D17; --i9:#D9E8A6;
  --g10:#43331F; --i10:#E8D2B8; --g11:#2E3238; --i11:#D9DCE0;
  color-scheme: dark;
}

/* Tópico → grifo (--tg) e tinta (--ti). Tópico desconhecido cai no neutro (11). */
.t { --tg: var(--g11); --ti: var(--i11); }
.t1{--tg:var(--g1);--ti:var(--i1)} .t2{--tg:var(--g2);--ti:var(--i2)} .t3{--tg:var(--g3);--ti:var(--i3)}
.t4{--tg:var(--g4);--ti:var(--i4)} .t5{--tg:var(--g5);--ti:var(--i5)} .t6{--tg:var(--g6);--ti:var(--i6)}
.t7{--tg:var(--g7);--ti:var(--i7)} .t8{--tg:var(--g8);--ti:var(--i8)} .t9{--tg:var(--g9);--ti:var(--i9)}
.t10{--tg:var(--g10);--ti:var(--i10)}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
.serif { font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.aviso { background: var(--warn-bg); color: var(--ink); border-bottom: 2px solid var(--warn-line); padding: 10px 16px; font-size: 15px; }
.aviso b { color: var(--warn); }

.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 64px; }
header.app { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
header.app h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.ferramentas { display: flex; flex-wrap: wrap; gap: 6px; }

.btn-sec, .btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 8px 12px; min-height: 44px;
}
.btn { border-color: var(--ink); background: var(--ink); color: var(--surface); font-weight: 600; }
.btn-sec:hover { border-color: var(--muted); }
.perigo { color: var(--err); }

nav.tabs { display: flex; gap: 2px; margin: 18px 0 20px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-bottom: 1px solid var(--line); }
nav.tabs button {
  border: 0; background: none; padding: 10px 14px; min-height: 44px; white-space: nowrap; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--aba, var(--ink)); }
nav.tabs .n { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }

main:focus { outline: none; }
h2 { font-size: 18px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 15px; }

/* ---------- Filtros ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-bottom: 14px; }
.filtros label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.filtros select { min-height: 40px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 260px; }
.contagem { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.refazer-on { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--info-bg); border-left: 4px solid var(--info); padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }

/* ---------- Etiquetas ---------- */
.tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 13px; font-weight: 600; background: var(--tg); color: var(--ti); }
.tipo { display: inline-block; font-size: 13px; font-weight: 600; padding: 0 8px; border-radius: 999px; border: 1.5px solid currentColor; }
.tipo.ce { color: var(--ce); } .tipo.me { color: var(--me); } .tipo.disc { color: var(--disc); }
.dif { font-size: 13px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }

/* ---------- Cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ti); border-radius: 10px; padding: 18px; }
.card + .card { margin-top: 14px; }
.card h3 { margin: 0 0 8px; font-size: 18px; }
.card ul { margin: 0 0 10px; padding-left: 20px; }
.card li + li { margin-top: 4px; }
.base { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.enun { font-size: 17px; line-height: 1.6; margin: 0 0 14px; white-space: pre-line; }

.indice { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.indice a { text-decoration: none; }
.indice a .tag { padding: 4px 10px; }
.indice a[data-feito="1"] .tag::before { content: "✓ "; }

.pegadinha { background: var(--warn-bg); border-left: 4px solid var(--warn-line); padding: 10px 12px; border-radius: 6px; margin-top: 12px; }
.pegadinha b { color: var(--warn); }
.pegadinha ul { margin: 4px 0 0; }
.verificar { font-size: 14px; color: var(--muted); margin-top: 10px; }
.revisado { margin-top: 12px; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; min-height: 44px; }
.revisado[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); font-weight: 600; }

.tabela-wrap { overflow-x: auto; }
table.quadro { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
table.quadro th, table.quadro td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
table.quadro thead th { background: var(--bg); }
table.quadro tbody th { font-weight: 600; background: var(--bg); }

/* ---------- Respostas ---------- */
.ce-opcoes { display: flex; gap: 8px; flex-wrap: wrap; }
.ce-opcoes button { min-width: 104px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.alts { display: flex; flex-direction: column; gap: 8px; }
.alts button { text-align: left; display: flex; gap: 10px; padding: 10px 12px; min-height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); }
.alts b { min-width: 1.2em; }
.ce-opcoes button:not(:disabled):hover, .alts button:not(:disabled):hover { border-color: var(--ink); }
button:disabled { cursor: default; }
.certa { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.errada { border-color: var(--err) !important; background: var(--err-bg) !important; }
.res { margin: 12px 0 0; font-weight: 600; }
.res.ok { color: var(--ok); } .res.err { color: var(--err); }
.coment { margin-top: 10px; padding: 12px; border-radius: 6px; background: var(--info-bg); border-left: 4px solid var(--info); }
.coment p { margin: 0 0 6px; } .coment p:last-child { margin: 0; }
.coment .lbl { font-weight: 600; color: var(--info); }
.acoes-q { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- Discursivas ---------- */
textarea.resp { width: 100%; min-height: 180px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); line-height: 1.6; resize: vertical; }
.espelho { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.espelho label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.espelho label + label { border-top: 1px solid var(--line); }
.espelho input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--ok); }
.espelho .pts { margin-left: auto; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nota { font-weight: 700; margin: 10px 0 0; font-size: 17px; }

/* ---------- Desempenho ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 22px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .r { color: var(--muted); font-size: 14px; }
.kpi.ce { border-top: 4px solid var(--ce); } .kpi.me { border-top: 4px solid var(--me); } .kpi.disc { border-top: 4px solid var(--disc); }
.fracos { background: var(--err-bg); border-left: 4px solid var(--err); border-radius: 6px; padding: 10px 12px; margin-bottom: 18px; }
.fracos b { color: var(--err); }
.desemp { display: grid; gap: 12px; }
.linha { display: grid; grid-template-columns: minmax(150px, 240px) 1fr 92px; gap: 10px; align-items: center; }
.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--ti); }
.pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.pct b { font-size: 16px; }
.selo { font-size: 12px; font-weight: 600; margin-left: 6px; }
.selo.fraco { color: var(--err); } .selo.rev { color: var(--ok); }
.vazio { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.vazio p { margin: 0 0 10px; }

@media (max-width: 560px) {
  header.app h1 { font-size: 20px; }
  .linha { grid-template-columns: 1fr auto; }
  .linha .bar { grid-column: 1 / -1; grid-row: 2; }
  .filtros label, .filtros select { flex: 1 1 140px; max-width: none; }
}
</style>
</head>

<div class="wrap">

      "B": "Tem por parâmetro exclusivo os princípios sensíveis da Constituição Federal.",
      "C": "Autoriza o Estado a intervir em Município quando o Tribunal de Justiça der provimento à representação para assegurar princípios da Constituição Estadual ou prover a execução de lei, ordem ou decisão judicial.",
      "D": "É julgada pelo Superior Tribunal de Justiça, por envolver a execução de lei federal.",
      "E": "Autoriza o Estado a intervir em Município, mas o decreto do Governador sempre depende de aprovação da Assembleia Legislativa."
    },
    "gabarito": "C",
    "comentario": {
      "justificativa": "O art. 35, IV, permite a intervenção do Estado no Município quando o Tribunal de Justiça der provimento a representação para assegurar a observância de princípios indicados na Constituição Estadual ou para prover a execução de lei, de ordem ou de decisão judicial. A: a intervenção em Município, em regra, é estadual, e a federal só ocorre em Município de Território. B: o parâmetro inclui princípios da Constituição Estadual e a execução de lei, ordem ou decisão. D: a competência é do Tribunal de Justiça. E: o art. 36, § 3º, dispensa a apreciação da Assembleia Legislativa, e o decreto se limita a suspender o ato impugnado, se isso bastar.",
      "fundamento": "CF, arts. 35, IV, e 36, § 3º.",
      "pegadinha": "A alternativa E transporta a exigência geral de controle político (art. 36, § 1º) para um caso em que ela é dispensada."
    }
  },
  {
    "id": "estadual-me-006",
    "tipo": "me",
    "topico": "estadual",
    "dificuldade": "facil",
    "estilo": "FCC",
    "enunciado": "A decisão que o Tribunal de Justiça profere ao julgar procedente representação de inconstitucionalidade contra lei municipal, em face da Constituição Estadual, produz",
    "alternativas": {
      "A": "efeitos apenas entre as partes, dependendo de resolução da Câmara Municipal para alcançar terceiros.",
      "B": "eficácia contra todos (erga omnes) nos limites do Estado, sem necessidade de resolução legislativa.",
      "C": "eficácia contra todos em todo o território nacional, com efeito vinculante a todos os tribunais.",
      "D": "efeitos apenas para o futuro, sem possibilidade de retroação.",
      "E": "efeitos apenas se confirmada a decisão pelo STF em recurso extraordinário."
    },
    "gabarito": "B",
    "comentario": {
      "justificativa": "A decisão em controle abstrato estadual tem eficácia erga omnes, nos limites do território do Estado, pois a lei municipal é invalidada para todos os seus destinatários. A: confunde controle abstrato com difuso. C: o alcance territorial é estadual. D: a regra de efeitos temporais segue a teoria da nulidade, com possibilidade de modulação. E: a decisão produz efeitos independentemente de recurso.",
      "fundamento": "CF, art. 125, § 2º.",
      "pegadinha": "A alternativa A traz a lógica do art. 52, X, da CF para um âmbito em que ela não se aplica."
    }
  }
];
</script>
<script>
'use strict';
(() => {
  const CHAVE = 'ccq-v1';
  const LIMIAR_FRACO = 60;
  const MIN_RESPOSTAS_FRACO = 5;

  const ABAS = [
    { id: 'revisao', rotulo: 'Revisão' },
    { id: 'ce', rotulo: 'C/E', cor: 'var(--ce)' },
    { id: 'me', rotulo: 'Múltipla escolha', cor: 'var(--me)' },
    { id: 'disc', rotulo: 'Discursivas', cor: 'var(--disc)' },
    { id: 'desempenho', rotulo: 'Desempenho' },
  ];
  const NOME_TIPO = { ce: 'Certo ou errado', me: 'Múltipla escolha', disc: 'Discursiva' };
  const NOME_DIF = { facil: 'fácil', media: 'média', dificil: 'difícil' };

  const TOPICOS = [...DATA.topicos].sort((a, b) => a.ordem - b.ordem);
  const TOP = new Map(TOPICOS.map((t) => [t.id, t]));
  // Questões acrescentadas à mão com campos faltando são ignoradas em vez de quebrar a página.
  const QS = QUESTOES.filter((q) => q && typeof q.id === 'string' && ['ce', 'me', 'disc'].includes(q.tipo));
  const POR_ID = new Map(QS.map((q) => [q.id, q]));

  const classeTopico = (id) => {
    const t = TOP.get(id);
    return t && t.ordem <= 10 ? `t t${t.ordem}` : 't';
  };
  const nomeTopico = (id) => TOP.get(id)?.curto ?? id;

  // ---------- DOM ----------
  function h(tag, props, ...filhos) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat(Infinity)) {
      if (f == null || f === false) continue;
      el.append(f instanceof Node ? f : String(f));
    }
    return el;
  }
  const $ = (sel) => document.querySelector(sel);

  // ---------- Estado e persistência ----------
  const vazio = () => ({
    versao: 1, respostas: {}, discursivas: {}, revisados: {},
    prefs: { aba: 'revisao', tema: 'auto', filtros: {} },
  });
  const ehObjeto = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);

  // Aceita só o formato deste app; descarta campos estranhos. Lança erro se não reconhecer.
  function normalizar(o) {
    if (!ehObjeto(o) || o.versao !== 1 || !ehObjeto(o.respostas) || !ehObjeto(o.revisados)) {
      throw new Error('O arquivo não é um progresso exportado por este material.');
    }
    const e = vazio();
    for (const [id, r] of Object.entries(o.respostas)) {
      if (ehObjeto(r) && typeof r.marcada === 'string') {
        e.respostas[id] = { marcada: r.marcada, tentativas: Math.max(1, Number(r.tentativas) || 1), ts: Number(r.ts) || 0 };
      }
    }
    if (ehObjeto(o.discursivas)) {
      for (const [id, d] of Object.entries(o.discursivas)) {
        if (!ehObjeto(d)) continue;
        e.discursivas[id] = {
          texto: typeof d.texto === 'string' ? d.texto : '',
          itens: Array.isArray(d.itens) ? d.itens.filter(Number.isInteger) : [],
        };
      }
    }
    for (const [id, v] of Object.entries(o.revisados)) if (v === true) e.revisados[id] = true;
    if (ehObjeto(o.prefs)) {
      if (['auto', 'claro', 'escuro'].includes(o.prefs.tema)) e.prefs.tema = o.prefs.tema;
      if (ABAS.some((a) => a.id === o.prefs.aba)) e.prefs.aba = o.prefs.aba;
      if (ehObjeto(o.prefs.filtros)) {
        for (const [tipo, f] of Object.entries(o.prefs.filtros)) {
          if (ehObjeto(f)) e.prefs.filtros[tipo] = { topico: String(f.topico || ''), dif: String(f.dif || ''), status: String(f.status || '') };
        }
      }
    }
    return e;
  }

  let semArmazenamento = false;
  function testarArmazenamento() {
    try {
      localStorage.setItem(`${CHAVE}-teste`, '1');
      localStorage.removeItem(`${CHAVE}-teste`);
    } catch {
      semArmazenamento = true;
    }
  }
  function carregar() {
    if (semArmazenamento) return vazio();
    try {
      const bruto = localStorage.getItem(CHAVE);
      return bruto ? normalizar(JSON.parse(bruto)) : vazio();
    } catch {
      return vazio();
    }
  }
  function salvar() {
    if (semArmazenamento) return;
    try {
      localStorage.setItem(CHAVE, JSON.stringify(estado));
    } catch {
      semArmazenamento = true;
      mostrarAviso();
    }
  }
  function mostrarAviso() {
    const el = $('#aviso');
    el.replaceChildren(
      h('b', { text: 'Progresso não está sendo salvo. ' }),
      'O navegador bloqueou o armazenamento local (comum em janela anônima). Suas respostas valem até fechar a aba; use Exportar para guardá-las em arquivo.',
    );
    el.hidden = false;
  }

  let toastTimer;
  function toast(msg) {
    let el = $('#toast');
    if (!el) {
      el = h('div', { id: 'toast', role: 'status', class: 'toast' });
      Object.assign(el.style, {
        position: 'fixed', left: '50%', bottom: '16px', transform: 'translateX(-50%)', maxWidth: 'calc(100% - 32px)',
        background: 'var(--ink)', color: 'var(--surface)', padding: '10px 14px', borderRadius: '8px', zIndex: 10,
      });
      document.body.append(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  testarArmazenamento();
  let estado = carregar();
  // Questões que o usuário escolheu refazer nesta sessão: aparecem sem a resposta anterior.
  const refazendo = new Set();
  let modoRefazer = null; // 'ce' | 'me' | null
  let lote = new Set(); // ids erradas (com os filtros vigentes) no momento em que o modo refazer começou

  // ---------- Cálculos ----------
  const resposta = (q) => estado.respostas[q.id];
  const acertou = (q) => resposta(q)?.marcada === q.gabarito;
  const statusDe = (q) => (!resposta(q) ? 'nao' : acertou(q) ? 'certa' : 'errada');
  const notaDisc = (q) => {
    const d = estado.discursivas[q.id];
    if (!d || !d.itens.length) return null;
    return d.itens.reduce((s, i) => s + (q.espelho[i]?.pontos || 0), 0);
  };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);

  function placar(lista) {
    const resp = lista.filter((q) => resposta(q));
    const certas = resp.filter(acertou).length;
    return { respondidas: resp.length, certas, total: lista.length, pct: pct(certas, resp.length) };
  }

  // ---------- Abas ----------
  function renderAbas() {
    const nav = $('#tabs');
    nav.replaceChildren(...ABAS.map((a) => {
      const sel = estado.prefs.aba === a.id;
      let n = null;
      if (a.id === 'ce' || a.id === 'me') {
        const p = placar(QS.filter((q) => q.tipo === a.id));
        n = h('span', { class: 'n', text: `${p.respondidas}/${p.total}` });
      }
      const b = h('button', {
        role: 'tab', id: `aba-${a.id}`, 'aria-selected': String(sel), 'aria-controls': 'painel',
        tabindex: sel ? '0' : '-1', type: 'button', onclick: () => irPara(a.id),
      }, a.rotulo, n);
      if (a.cor) b.style.setProperty('--aba', a.cor);
      return b;
    }));
    $('#painel').setAttribute('aria-labelledby', `aba-${estado.prefs.aba}`);
  }
  $('#tabs').addEventListener('keydown', (e) => {
    const i = ABAS.findIndex((a) => a.id === estado.prefs.aba);
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % ABAS.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + ABAS.length) % ABAS.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = ABAS.length - 1;
    if (j === null) return;
    e.preventDefault();
    irPara(ABAS[j].id);
    $(`#aba-${ABAS[j].id}`).focus();
  });

  function irPara(aba) {
    if (aba !== estado.prefs.aba) { modoRefazer = null; refazendo.clear(); }
    estado.prefs.aba = aba;
    salvar();
    render();
  }

  function render() {
    renderAbas();
    renderTema();
    const painel = $('#painel');
    const aba = estado.prefs.aba;
    const conteudo = aba === 'revisao' ? viewRevisao()
      : aba === 'ce' || aba === 'me' ? viewObjetivas(aba)
      : aba === 'disc' ? viewDiscursivas()
      : viewDesempenho();
    painel.replaceChildren(conteudo);
  }

  // ---------- Revisão ----------
  function botaoRevisado(id) {
    const feito = !!estado.revisados[id];
    return h('button', {
      type: 'button', class: 'revisado', 'aria-pressed': String(feito),
      onclick: () => {
        if (estado.revisados[id]) delete estado.revisados[id]; else estado.revisados[id] = true;
        salvar();
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      },
    }, feito ? '✓ Revisado' : 'Marcar como revisado');
  }

  function cardRevisao(t) {
    const r = DATA.revisao[t.id];
    if (!r) {
      return h('article', { class: `card ${classeTopico(t.id)}`, id: `rev-${t.id}` },
        h('h3', { text: t.titulo }), h('p', { class: 'lead', text: 'Conteúdo ainda não incluído.' }));
    }
    if (t.id === 'quadro') {
      return h('article', { class: `card ${classeTopico(t.id)}`, id: `rev-${t.id}` },
        h('h3', { text: t.titulo }),
        h('div', { class: 'tabela-wrap', tabindex: '0', role: 'region', 'aria-label': t.titulo },
          h('table', { class: 'quadro' },
            h('thead', {}, h('tr', {}, h('th', { scope: 'col', text: 'Critério' }), r.colunas.map((c) => h('th', { scope: 'col', text: c })))),
            h('tbody', {}, r.linhas.map((l) => h('tr', {}, h('th', { scope: 'row', text: l.criterio }), l.valores.map((v) => h('td', { text: v }))))))),
        r.pegadinhas?.length ? caixaPegadinha(r.pegadinhas) : null,
        botaoRevisado(t.id));
    }
    return h('article', { class: `card ${classeTopico(t.id)}`, id: `rev-${t.id}` },
      h('div', { class: 'meta' }, h('span', { class: 'tag', text: t.curto })),
      h('h3', { text: t.titulo }),
      h('ul', { class: 'serif' }, r.resumo.map((l) => h('li', { text: l }))),
      h('p', { class: 'base', text: `Base legal: ${r.base_legal.join('; ')}.` }),
      caixaPegadinha(r.pegadinhas),
      botaoRevisado(t.id));
  }

  function caixaPegadinha(lista, rotulo = 'Pegadinha de prova') {
    if (lista.length === 1) return h('div', { class: 'pegadinha' }, h('b', { text: `⚠️ ${rotulo}: ` }), lista[0]);
    return h('div', { class: 'pegadinha' }, h('b', { text: `⚠️ ${rotulo}` }), h('ul', {}, lista.map((p) => h('li', { text: p }))));
  }

  function viewRevisao() {
    const comConteudo = TOPICOS.filter((t) => DATA.revisao[t.id]);
    const feitos = comConteudo.filter((t) => estado.revisados[t.id]).length;
    return h('div', {},
      h('h2', { text: 'Revisão por tópico' }),
      h('p', { class: 'lead', text: `${feitos} de ${comConteudo.length} tópicos revisados. Os tópicos estão na ordem em que mais caem.` }),
      h('nav', { class: 'indice', 'aria-label': 'Ir para o tópico' },
        TOPICOS.map((t) => h('a', { href: `#rev-${t.id}`, class: classeTopico(t.id), 'data-feito': estado.revisados[t.id] ? '1' : '0' },
          h('span', { class: 'tag', text: t.curto })))),
      TOPICOS.map(cardRevisao));
  }

  // ---------- Objetivas (C/E e ME) ----------
  function filtrosDe(tipo) {
    return (estado.prefs.filtros[tipo] ??= { topico: '', dif: '', status: '' });
  }

  function seletor(rotulo, valor, opcoes, aoMudar) {
    return h('label', {}, rotulo,
      h('select', { onchange: (e) => aoMudar(e.target.value) },
        opcoes.map(([v, t]) => h('option', { value: v, selected: v === valor, text: t }))));
  }

  function barraFiltros(tipo, comStatus) {
    const f = filtrosDe(tipo);
    const daAba = QS.filter((q) => q.tipo === tipo);
    const topicos = TOPICOS.filter((t) => daAba.some((q) => q.topico === t.id));
    const mudar = (campo) => (v) => { f[campo] = v; salvar(); render(); };
    return h('div', { class: 'filtros' },
      seletor('Tópico', f.topico, [['', 'Todos'], ...topicos.map((t) => [t.id, t.curto])], mudar('topico')),
      seletor('Dificuldade', f.dif, [['', 'Todas'], ['facil', 'Fácil'], ['media', 'Média'], ['dificil', 'Difícil']], mudar('dif')),
      comStatus ? seletor('Situação', f.status, [['', 'Todas'], ['nao', 'Não respondidas'], ['certa', 'Acertadas'], ['errada', 'Erradas']], mudar('status')) : null);
  }

  function aplicarFiltros(lista, f, comStatus) {
    return lista.filter((q) => (!f.topico || q.topico === f.topico)
      && (!f.dif || q.dificuldade === f.dif)
      && (!comStatus || !f.status || statusDe(q) === f.status));
  }

  const erradasFiltradas = (tipo) => aplicarFiltros(QS.filter((q) => q.tipo === tipo), { ...filtrosDe(tipo), status: 'errada' }, true);
  const rotuloRefazer = (tipo) => `Refazer só as erradas (${erradasFiltradas(tipo).length})`;

  function viewObjetivas(tipo) {
    const f = filtrosDe(tipo);
    const daAba = QS.filter((q) => q.tipo === tipo);
    const titulo = tipo === 'ce' ? 'Certo ou errado (estilo CEBRASPE)' : 'Múltipla escolha (estilo FGV/FCC)';
    const wrap = h('div', {}, h('h2', { text: titulo }));

    if (modoRefazer === tipo) {
      const lista = daAba.filter((q) => lote.has(q.id));
      wrap.append(
        h('div', { class: 'refazer-on' },
          h('span', { text: `Refazendo ${lista.length} questão(ões) que você errou. A resposta anterior fica oculta.` }),
          h('button', { type: 'button', class: 'btn-sec', onclick: () => { modoRefazer = null; refazendo.clear(); render(); } }, 'Sair do modo refazer')),
        lista.length ? h('div', {}, lista.map(cardObjetiva))
          : h('div', { class: 'vazio' }, h('p', { text: 'Nenhuma questão errada para refazer.' })));
      return wrap;
    }

    const lista = aplicarFiltros(daAba, f, true);
    wrap.append(
      h('p', { class: 'lead', text: 'Responda e veja o comentário com o fundamento e a pegadinha usada.' }),
      barraFiltros(tipo, true),
      h('div', { class: 'acoes-q', style: 'margin:0 0 14px' },
        h('button', {
          type: 'button', class: 'btn-sec', id: 'btn-refazer',
          onclick: () => {
            // Calculado no clique: respostas dadas depois do último render também contam.
            modoRefazer = tipo;
            refazendo.clear();
            erradasFiltradas(tipo).forEach((q) => refazendo.add(q.id));
            lote = new Set(refazendo);
            render();
          },
        }, rotuloRefazer(tipo))),
      h('p', { class: 'contagem', text: `${lista.length} questão(ões)` }),
      lista.length ? h('div', {}, lista.map(cardObjetiva))
        : h('div', { class: 'vazio' }, h('p', { text: 'Nenhuma questão com esses filtros.' }),
          h('button', { type: 'button', class: 'btn-sec', onclick: () => { Object.assign(f, { topico: '', dif: '', status: '' }); salvar(); render(); } }, 'Limpar filtros')));
    return wrap;
  }

  function responder(q, marcada, card) {
    const ant = estado.respostas[q.id];
    estado.respostas[q.id] = { marcada, tentativas: (ant?.tentativas || 0) + 1, ts: Date.now() };
    refazendo.delete(q.id);
    salvar();
    const novo = cardObjetiva(q);
    card.replaceWith(novo);
    novo.querySelector('.res')?.focus();
    const btn = $('#btn-refazer');
    if (btn) btn.textContent = rotuloRefazer(q.tipo);
    renderAbas();
  }

  function cardObjetiva(q) {
    const r = refazendo.has(q.id) ? null : resposta(q);
    const card = h('article', { class: `card ${classeTopico(q.topico)}`, 'data-id': q.id });
    card.append(
      h('div', { class: 'meta' },
        h('span', { class: `tipo ${q.tipo}`, text: NOME_TIPO[q.tipo] }),
        h('span', { class: 'tag', text: nomeTopico(q.topico) }),
        h('span', { class: 'dif', text: NOME_DIF[q.dificuldade] ?? q.dificuldade })),
      h('p', { class: 'enun serif', text: q.enunciado }));

    const classe = (valor) => {
      if (!r) return null;
      if (valor === q.gabarito) return 'certa';
      return valor === r.marcada ? 'errada' : null;
    };
    if (q.tipo === 'ce') {
      card.append(h('div', { class: 'ce-opcoes', role: 'group', 'aria-label': 'Sua resposta' },
        [['C', 'Certo'], ['E', 'Errado']].map(([v, t]) => h('button', {
          type: 'button', class: classe(v), disabled: !!r, 'aria-pressed': r ? String(r.marcada === v) : null,
          onclick: () => responder(q, v, card),
        }, t))));
    } else {
      card.append(h('div', { class: 'alts', role: 'group', 'aria-label': 'Alternativas' },
        Object.entries(q.alternativas || {}).map(([l, t]) => h('button', {
          type: 'button', class: classe(l), disabled: !!r, 'aria-pressed': r ? String(r.marcada === l) : null,
          onclick: () => responder(q, l, card),
        }, h('b', { text: l }), h('span', { text: t })))));
    }

    if (r) {
      const ok = r.marcada === q.gabarito;
      const gab = q.tipo === 'ce' ? (q.gabarito === 'C' ? 'Certo' : 'Errado') : q.gabarito;
      const c = q.comentario || {};
      card.append(
        h('p', { class: `res ${ok ? 'ok' : 'err'}`, tabindex: '-1' }, ok ? `Você acertou. Gabarito: ${gab}.` : `Você errou. Gabarito: ${gab}.`),
        h('div', { class: 'coment' },
          c.justificativa ? h('p', {}, h('span', { class: 'lbl', text: 'Justificativa. ' }), c.justificativa) : null,
          c.fundamento ? h('p', {}, h('span', { class: 'lbl', text: 'Fundamento. ' }), c.fundamento) : null),
        c.pegadinha ? caixaPegadinha([c.pegadinha], 'Pegadinha') : null,
        q.controverso ? h('div', { class: 'coment' },
          h('p', {}, h('span', { class: 'lbl', text: 'Entendimento atual. ' }), q.controverso.atual),
          h('p', {}, h('span', { class: 'lbl', text: 'Entendimento anterior. ' }), q.controverso.anterior)) : null,
        q.verificar?.length ? h('p', { class: 'verificar', text: `A confirmar: ${q.verificar.join(' ')}` }) : null,
        h('div', { class: 'acoes-q' },
          h('button', { type: 'button', class: 'btn-sec', onclick: () => { refazendo.add(q.id); card.replaceWith(cardObjetiva(q)); } }, 'Responder de novo')));
    }
    return card;
  }

  // ---------- Discursivas ----------
  function viewDiscursivas() {
    const f = filtrosDe('disc');
    const lista = aplicarFiltros(QS.filter((q) => q.tipo === 'disc'), f, false);
    return h('div', {},
      h('h2', { text: 'Discursivas' }),
      h('p', { class: 'lead', text: 'Escreva sua resposta, abra o espelho e marque os itens que você contemplou para ver sua nota.' }),
      barraFiltros('disc', false),
      h('p', { class: 'contagem', text: `${lista.length} questão(ões)` }),
      lista.length ? lista.map(cardDiscursiva) : h('div', { class: 'vazio' }, h('p', { text: 'Nenhuma questão com esses filtros.' })));
  }

  function cardDiscursiva(q) {
    const d = (estado.discursivas[q.id] ??= { texto: '', itens: [] });
    const idTxt = `resp-${q.id}`;
    const idEsp = `esp-${q.id}`;
    const nota = h('p', { class: 'nota', 'aria-live': 'polite' });
    const atualizarNota = () => {
      const n = notaDisc(q);
      nota.textContent = n === null ? 'Marque os itens que você contemplou.' : `Sua nota: ${n.toLocaleString('pt-BR')} de ${q.nota_maxima}`;
    };
    atualizarNota();

    const espelho = h('div', { class: 'espelho', id: idEsp, hidden: true },
      h('b', { text: 'Espelho de correção' }),
      q.espelho.map((it, i) => h('label', {},
        h('input', {
          type: 'checkbox', checked: d.itens.includes(i),
          onchange: (e) => {
            d.itens = e.target.checked ? [...new Set([...d.itens, i])].sort() : d.itens.filter((x) => x !== i);
            salvar();
            atualizarNota();
          },
        }),
        h('span', { class: 'serif', text: it.item }),
        h('span', { class: 'pts', text: `${it.pontos.toLocaleString('pt-BR')} pt` }))),
      nota);

    let timer;
    const toggle = h('button', {
      type: 'button', class: 'btn-sec', 'aria-expanded': 'false', 'aria-controls': idEsp,
      onclick: () => {
        espelho.hidden = !espelho.hidden;
        toggle.setAttribute('aria-expanded', String(!espelho.hidden));
        toggle.textContent = espelho.hidden ? 'Ver espelho' : 'Ocultar espelho';
      },
    }, 'Ver espelho');
    const ultima = notaDisc(q);

    return h('article', { class: `card ${classeTopico(q.topico)}` },
      h('div', { class: 'meta' },
        h('span', { class: 'tipo disc', text: NOME_TIPO.disc }),
        h('span', { class: 'tag', text: nomeTopico(q.topico) }),
        h('span', { class: 'dif', text: NOME_DIF[q.dificuldade] ?? q.dificuldade })),
      h('p', { class: 'enun serif', text: q.enunciado }),
      h('label', { for: idTxt, class: 'dif' }, `Sua resposta (sugestão: até ${q.linhas} linhas)`),
      h('textarea', {
        id: idTxt, class: 'resp serif', rows: String(Math.min(q.linhas, 14)),
        oninput: (e) => { d.texto = e.target.value; clearTimeout(timer); timer = setTimeout(salvar, 400); },
      }, d.texto),
      h('div', { class: 'acoes-q' }, toggle,
        ultima !== null ? h('span', { class: 'dif', style: 'align-self:center', text: `Última autoavaliação: ${ultima.toLocaleString('pt-BR')}/${q.nota_maxima}` }) : null),
      espelho);
  }

  // ---------- Desempenho ----------
  function viewDesempenho() {
    const obj = QS.filter((q) => q.tipo !== 'disc');
    const geral = placar(obj);
    const pce = placar(QS.filter((q) => q.tipo === 'ce'));
    const pme = placar(QS.filter((q) => q.tipo === 'me'));
    const discs = QS.filter((q) => q.tipo === 'disc').map(notaDisc).filter((n) => n !== null);
    const media = discs.length ? discs.reduce((a, b) => a + b, 0) / discs.length : null;
    const comRevisao = TOPICOS.filter((t) => DATA.revisao[t.id]);
    const revisados = comRevisao.filter((t) => estado.revisados[t.id]);

    const topicosQ = TOPICOS.filter((t) => obj.some((q) => q.topico === t.id));
    const linhas = topicosQ.map((t) => ({ t, p: placar(obj.filter((q) => q.topico === t.id)) }));
    const fracos = linhas.filter(({ p }) => p.respondidas >= MIN_RESPOSTAS_FRACO && p.pct < LIMIAR_FRACO);
    const fmt = (p) => (p.pct === null ? '—' : `${p.pct}%`);

    const kpi = (classe, rotulo, valor, rodape) => h('div', { class: `kpi ${classe}` },
      h('div', { class: 'r', text: rotulo }), h('div', { class: 'v', text: valor }), h('div', { class: 'r', text: rodape }));

    return h('div', {},
      h('h2', { text: 'Desempenho' }),
      h('p', { class: 'lead', text: 'Acerto calculado sobre a última resposta de cada questão objetiva.' }),
      h('div', { class: 'kpis' },
        kpi('', 'Objetivas', fmt(geral), `${geral.respondidas} de ${geral.total} respondidas`),
        kpi('ce', 'Certo ou errado', fmt(pce), `${pce.certas} acertos em ${pce.respondidas}`),
        kpi('me', 'Múltipla escolha', fmt(pme), `${pme.certas} acertos em ${pme.respondidas}`),
        kpi('disc', 'Discursivas', media === null ? '—' : `${media.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}/10`, `${discs.length} autoavaliada(s)`),
        kpi('', 'Revisão', `${revisados.length}/${comRevisao.length}`, 'tópicos revisados')),
      fracos.length
        ? h('div', { class: 'fracos' }, h('b', { text: 'Tópicos fracos: ' }), fracos.map(({ t, p }) => `${t.curto} (${p.pct}%)`).join(', '), '.')
        : h('p', { class: 'contagem', text: `Nenhum tópico fraco por enquanto (critério: menos de ${LIMIAR_FRACO}% com pelo menos ${MIN_RESPOSTAS_FRACO} respostas).` }),
      h('h2', { text: 'Por tópico', style: 'margin-top:8px' }),
      h('div', { class: 'desemp' }, linhas.map(({ t, p }) => h('div', { class: `linha ${classeTopico(t.id)}` },
        h('span', {},
          h('span', { class: 'tag', text: t.curto }),
          fracos.some((x) => x.t === t) ? h('span', { class: 'selo fraco', text: 'fraco' }) : null,
          estado.revisados[t.id] ? h('span', { class: 'selo rev', text: '✓ revisado' }) : null),
        h('div', { class: 'bar', role: 'img', 'aria-label': p.pct === null ? 'sem respostas' : `${p.pct}% de acerto` },
          h('i', { style: `width:${p.pct ?? 0}%` })),
        h('span', { class: 'pct' }, h('b', { text: fmt(p) }), ` · ${p.certas}/${p.respondidas}`)))));
  }

  // ---------- Tema ----------
  const ROTULO_TEMA = { auto: 'Tema: automático', claro: 'Tema: claro', escuro: 'Tema: escuro' };
  function renderTema() {
    const root = document.documentElement;
    if (estado.prefs.tema === 'auto') delete root.dataset.modo; else root.dataset.modo = estado.prefs.tema;
    $('#btn-tema').textContent = ROTULO_TEMA[estado.prefs.tema];
  }
  $('#btn-tema').addEventListener('click', () => {
    const ordem = ['auto', 'claro', 'escuro'];
    estado.prefs.tema = ordem[(ordem.indexOf(estado.prefs.tema) + 1) % ordem.length];
    salvar();
    renderTema();
  });

  // ---------- Exportar / Importar / Zerar ----------
  $('#btn-exportar').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ ...estado, exportadoEm: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `progresso-controle-constitucionalidade-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Progresso exportado.');
  });
  $('#btn-importar').addEventListener('click', () => $('#arq-importar').click());
  $('#arq-importar').addEventListener('change', async (e) => {
    const arq = e.target.files[0];
    e.target.value = '';
    if (!arq) return;
    let novo;
    try {
      novo = normalizar(JSON.parse(await arq.text()));
    } catch (err) {
      toast(`Importação cancelada: ${err instanceof SyntaxError ? 'o arquivo não é um JSON válido.' : err.message}`);
      return;
    }
    if (!confirm('Substituir o progresso atual pelo do arquivo?')) return;
    estado = novo;
    refazendo.clear();
    modoRefazer = null;
    salvar();
    render();
    toast('Progresso importado.');
  });
  $('#btn-zerar').addEventListener('click', () => {
    if (!confirm('Apagar todas as respostas, autoavaliações e marcações de revisão? Isso não pode ser desfeito (exporte antes, se quiser guardar).')) return;
    const tema = estado.prefs.tema;
    estado = vazio();
    estado.prefs.tema = tema;
    refazendo.clear();
    modoRefazer = null;
    salvar();
    render();
    toast('Progresso zerado.');
  });

  if (semArmazenamento) mostrarAviso();
  render();
})();

</script>
</body>
</html>
